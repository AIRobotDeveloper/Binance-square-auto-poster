name: Binance Square Auto Publisher V3

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Test mode"
        required: true
        type: choice
        default: news
        options:
          - news
          - education
          - article

  schedule:
    # 09:05, 14:05, 20:05 Asia/Karachi = 04:05, 09:05, 15:05 UTC
    - cron: "5 4 * * *"
    - cron: "5 9 * * *"
    - cron: "5 15 * * *"

permissions:
  contents: read

concurrency:
  group: binance-square-auto-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
      INPUT_MODE: ${{ inputs.mode }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}

    steps:
      - name: Select content mode
        shell: bash
        run: |
          set -euo pipefail

          MODE="${INPUT_MODE:-}"

          if [ -z "$MODE" ]; then
            case "$EVENT_SCHEDULE" in
              "5 4 * * *")  MODE="news" ;;
              "5 9 * * *")  MODE="education" ;;
              "5 15 * * *") MODE="article" ;;
              *)
                HOUR=$(TZ=Asia/Karachi date +%H)
                if [ "$HOUR" -lt 12 ]; then
                  MODE="news"
                elif [ "$HOUR" -lt 18 ]; then
                  MODE="education"
                else
                  MODE="article"
                fi
                ;;
            esac
          fi

          case "$MODE" in
            news|education|article) ;;
            *) echo "Invalid mode: $MODE"; exit 1 ;;
          esac

          echo "CONTENT_MODE=$MODE" >> "$GITHUB_ENV"
          echo "Selected mode: $MODE"

      - name: Install Pillow
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir Pillow

      - name: Generate content, market data and image
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import datetime as dt
          import email.utils
          import html
          import json
          import os
          import re
          import socket
          import textwrap
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          from PIL import Image, ImageDraw, ImageFont

          MODE = os.environ["CONTENT_MODE"]
          GEMINI_API_KEY = os.environ["GEMINI_API_KEY"].strip()

          if not GEMINI_API_KEY:
              raise SystemExit("GEMINI_API_KEY is missing.")

          # Current Gemini fallback chain. The workflow tries the next model
          # if a model is unavailable, rate-limited, times out or errors.
          GEMINI_MODELS = [
              "gemini-3.8-flash",
              "gemini-3.7-flash",
              "gemini-3.6-flash",
              "gemini-3.5-flash-lite",
              "gemini-3.1-flash-lite",
          ]

          RSS_FEEDS = [
              ("CoinDesk", "https://www.coindesk.com/arc/outboundfeeds/rss/"),
              ("Cointelegraph", "https://cointelegraph.com/rss"),
              ("Decrypt", "https://decrypt.co/feed"),
              ("The Block", "https://www.theblock.co/rss.xml"),
              ("Bitcoin Magazine", "https://bitcoinmagazine.com/.rss/full/"),
          ]

          COINS = {
              "bitcoin": "BTC", "btc": "BTC",
              "ethereum": "ETH", "eth": "ETH",
              "binance": "BNB", "bnb": "BNB",
              "solana": "SOL", "sol": "SOL",
              "xrp": "XRP", "ripple": "XRP",
              "cardano": "ADA", "ada": "ADA",
              "dogecoin": "DOGE", "doge": "DOGE",
              "chainlink": "LINK", "link": "LINK",
              "avalanche": "AVAX", "avax": "AVAX",
              "sui": "SUI", "aptos": "APT", "apt": "APT",
              "tron": "TRX", "trx": "TRX",
              "polkadot": "DOT", "dot": "DOT",
              "litecoin": "LTC", "ltc": "LTC",
          }

          NOW = dt.datetime.now(dt.timezone.utc)
          PKT = NOW + dt.timedelta(hours=5)

          def clean(s):
              if not s:
                  return ""
              s = html.unescape(str(s))
              s = re.sub(r"<[^>]+>", " ", s)
              s = re.sub(r"\s+", " ", s)
              return s.strip()

          def lname(tag):
              return tag.split("}", 1)[-1].lower()

          def child(parent, wanted):
              for c in parent:
                  if lname(c.tag) == wanted.lower():
                      return clean(c.text)
              return ""

          def parse_date(s):
              try:
                  d = email.utils.parsedate_to_datetime(s)
                  if d.tzinfo is None:
                      d = d.replace(tzinfo=dt.timezone.utc)
                  return d.astimezone(dt.timezone.utc)
              except Exception:
                  return NOW

          def feed(source, url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0 BinanceSquareV3"}
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      root = ET.fromstring(r.read())
              except Exception as e:
                  print(f"Feed failed: {source}: {type(e).__name__}: {e}")
                  return []

              out = []
              for item in root.iter():
                  if lname(item.tag) == "item":
                      title = child(item, "title")
                      link = child(item, "link")
                      summary = child(item, "description") or child(item, "summary")
                      published = (
                          child(item, "pubDate")
                          or child(item, "published")
                          or child(item, "updated")
                      )
                      if title and link:
                          out.append({
                              "source": source,
                              "title": title,
                              "summary": summary[:900],
                              "url": link,
                              "published": parse_date(published),
                          })
              return out

          def collect_news():
              items = []
              for source, url in RSS_FEEDS:
                  items.extend(feed(source, url))

              cutoff = NOW - dt.timedelta(hours=72)
              items = [x for x in items if x["published"] >= cutoff] or items

              seen_urls = set()
              unique = []
              for x in items:
                  if x["url"] in seen_urls:
                      continue
                  seen_urls.add(x["url"])
                  blob = (x["title"] + " " + x["summary"]).lower()
                  crypto_bonus = sum(2 for term in COINS if term in blob)
                  recency = max(
                      0,
                      72 - max(
                          0,
                          (NOW - x["published"]).total_seconds() / 3600
                      )
                  )
                  source_bonus = {
                      "CoinDesk": 6,
                      "The Block": 6,
                      "Cointelegraph": 5,
                      "Decrypt": 5,
                      "Bitcoin Magazine": 4,
                  }.get(x["source"], 1)
                  x["score"] = recency + crypto_bonus + source_bonus
                  unique.append(x)

              unique.sort(key=lambda x: x["score"], reverse=True)

              # Remove near-duplicate headlines.
              def words(s):
                  return set(
                      w for w in re.findall(r"[a-z0-9]+", s.lower())
                      if len(w) > 2
                  )

              chosen = []
              for x in unique:
                  a = words(x["title"])
                  duplicate = False
                  for y in chosen:
                      b = words(y["title"])
                      if a and b:
                          j = len(a & b) / max(1, len(a | b))
                          if j >= 0.72:
                              duplicate = True
                              break
                  if not duplicate:
                      chosen.append(x)
                  if len(chosen) == 12:
                      break

              print(f"Collected {len(chosen)} useful news candidates.")
              return chosen

          def infer_coin(text):
              text = text.lower()
              for name, symbol in COINS.items():
                  if re.search(r"\b" + re.escape(name) + r"\b", text):
                      return symbol
              m = re.search(r"\$([A-Z]{2,10})\b", text.upper())
              return m.group(1) if m else "BTC"

          def gemini(prompt, max_tokens):
              failures = []
              for model in GEMINI_MODELS:
                  print(f"Trying Gemini: {model}")
                  url = (
                      "https://generativelanguage.googleapis.com/"
                      f"v1beta/models/{model}:generateContent"
                  )
                  payload = {
                      "contents": [{"parts": [{"text": prompt}]}],
                      "generationConfig": {
                          "temperature": 0.72,
                          "maxOutputTokens": max_tokens,
                      },
                  }
                  req = urllib.request.Request(
                      url,
                      data=json.dumps(payload).encode(),
                      headers={
                          "Content-Type": "application/json",
                          "x-goog-api-key": GEMINI_API_KEY,
                      },
                      method="POST",
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=45) as r:
                          data = json.load(r)
                      parts = (
                          data.get("candidates", [{}])[0]
                          .get("content", {})
                          .get("parts", [])
                      )
                      text = "".join(
                          p.get("text", "")
                          for p in parts
                          if isinstance(p, dict)
                      ).strip()
                      if text:
                          print(f"SUCCESS with {model}")
                          return text, model
                      raise ValueError("Empty Gemini output.")
                  except urllib.error.HTTPError as e:
                      detail = e.read().decode("utf-8", errors="replace")[:600]
                      msg = f"{model}: HTTP {e.code}: {detail}"
                      print(msg)
                      failures.append(msg)
                  except (TimeoutError, socket.timeout) as e:
                      msg = f"{model}: timeout: {e}"
                      print(msg)
                      failures.append(msg)
                  except Exception as e:
                      msg = f"{model}: {type(e).__name__}: {e}"
                      print(msg)
                      failures.append(msg)
              raise SystemExit("All Gemini models failed:\n" + "\n".join(failures))

          def parse_json(text):
              text = re.sub(r"^```(?:json)?\s*", "", text.strip(), flags=re.I)
              text = re.sub(r"\s*```$", "", text)
              a = text.find("{")
              b = text.rfind("}")
              if a < 0 or b < 0:
                  raise ValueError("No JSON object in Gemini response.")
              return json.loads(text[a:b+1])

          news_items = collect_news()

          if MODE == "news":
              source_data = json.dumps(
                  [
                      {
                          "source": x["source"],
                          "title": x["title"],
                          "published_utc": x["published"].isoformat(),
                          "summary": x["summary"],
                          "url": x["url"],
                      }
                      for x in news_items
                  ],
                  ensure_ascii=False,
                  indent=2,
              )

              prompt = f"""
          You are the senior editor of a professional Binance Square crypto account.

          Current Pakistan date/time: {PKT.isoformat()}

          CURRENT NEWS CANDIDATES:
          {source_data}

          Select the strongest genuinely recent crypto story.

          Editorial rules:
          - Prefer stories supported by multiple independent sources.
          - Do not invent facts, prices, dates, people, quotations or events.
          - Clearly label a proposal/report as a proposal/report.
          - No rumors presented as facts.
          - No financial advice.
          - No guaranteed returns.
          - No buy/sell commands.
          - No price predictions.
          - Write a useful 650-950 character post, not a tiny summary.
          - Include what happened, why it matters, and what readers should watch.
          - Pick the most relevant coin/project and a real Binance-style USDT pair.
          - For a non-coin-specific story use BTC/USDT and label it as a market reference.
          - Do not invent market numbers; live numbers will be added separately.
          - Use 4-5 hashtags.

          Return ONLY JSON:
          {{
            "headline": "strong headline",
            "subheadline": "one concise context line",
            "post": "650-950 character post body",
            "coin": "BTC",
            "pair": "BTC/USDT",
            "category": "Regulation",
            "takeaway": "one-sentence why this matters",
            "hashtags": ["#Bitcoin", "#BTC", "#CryptoNews", "#Blockchain"]
          }}
          """

              raw, model_used = gemini(prompt, 1400)
              data = parse_json(raw)

          elif MODE == "education":
              topics = [
                  "risk management",
                  "spot vs futures",
                  "wallet security",
                  "private keys",
                  "stablecoins",
                  "liquidity",
                  "market cycles",
                  "trading psychology",
                  "DCA",
                  "DeFi",
                  "crypto scams",
                  "on-chain data",
                  "staking",
                  "layer-2 networks",
                  "ETF basics",
              ]
              topic = topics[PKT.timetuple().tm_yday % len(topics)]

              prompt = f"""
          Write a professional Binance Square educational post.

          Topic: {topic}
          Date: {PKT.strftime("%d %B %Y")}

          Rules:
          - 650-950 characters.
          - Start with an engaging hook.
          - Explain the concept clearly.
          - Give a practical example.
          - End with a concise takeaway.
          - No financial advice.
          - No profit guarantees.
          - No buy/sell instruction.
          - No price prediction.
          - Include a relevant coin and pair; use BTC/USDT when the topic is broad.
          - Do not fabricate statistics.
          - Add 4-5 relevant hashtags.

          Return ONLY JSON:
          {{
            "headline": "educational headline",
            "subheadline": "short context line",
            "post": "650-950 character post body",
            "coin": "BTC",
            "pair": "BTC/USDT",
            "category": "Education",
            "takeaway": "one-sentence takeaway",
            "hashtags": ["#Bitcoin", "#CryptoEducation", "#Blockchain", "#RiskManagement"]
          }}
          """

              raw, model_used = gemini(prompt, 1400)
              data = parse_json(raw)

          elif MODE == "article":
              source_data = json.dumps(
                  [
                      {
                          "source": x["source"],
                          "title": x["title"],
                          "published_utc": x["published"].isoformat(),
                          "summary": x["summary"],
                          "url": x["url"],
                      }
                      for x in news_items
                  ],
                  ensure_ascii=False,
                  indent=2,
              )

              prompt = f"""
          You are a research writer for a professional Binance Square account.

          Current Pakistan date/time: {PKT.isoformat()}

          Recent crypto news:
          {source_data}

          Write ONE original long-form article around the strongest story/theme.

          Requirements:
          - 3000-5000 characters.
          - Strong title.
          - Introduction.
          - What happened.
          - Why it matters.
          - Market/industry context.
          - What to watch next.
          - Conclusion.
          - Distinguish confirmed facts from reports and uncertainty.
          - No fabricated quotes or statistics.
          - No financial advice.
          - No guaranteed returns.
          - No buy/sell commands.
          - No price predictions.
          - Include a relevant coin and USDT trading pair.
          - Add 4-5 relevant hashtags at the end.
          - Write original prose; do not copy source wording.

          Return ONLY JSON:
          {{
            "headline": "article title",
            "article": "3000-5000 character article body",
            "coin": "BTC",
            "pair": "BTC/USDT",
            "category": "Market Analysis",
            "takeaway": "one-sentence key takeaway",
            "hashtags": ["#Bitcoin", "#BTC", "#CryptoAnalysis", "#CryptoNews"]
          }}
          """

              raw, model_used = gemini(prompt, 3200)
              data = parse_json(raw)

          else:
              raise SystemExit("Unsupported mode.")

          headline = clean(data.get("headline", "Crypto Update"))
          subheadline = clean(
              data.get("subheadline", "Latest cryptocurrency update")
          )
          takeaway = clean(
              data.get("takeaway", "Focus on facts, context and risk.")
          )
          category = clean(
              data.get("category", "Crypto")
          )[:60]

          coin = clean(
              data.get("coin", "")
          ).upper()

          if not re.fullmatch(r"[A-Z0-9]{2,12}", coin):
              coin = infer_coin(
                  headline + " " +
                  clean(data.get("article", data.get("post", "")))
              )

          pair = clean(
              data.get("pair", "")
          ).upper().replace(" ", "")

          m = re.fullmatch(r"([A-Z0-9]{2,12})/USDT", pair)
          if m:
              coin = m.group(1)
              pair = coin + "/USDT"
          else:
              pair = coin + "/USDT"

          raw_tags = data.get("hashtags", [])
          if not isinstance(raw_tags, list):
              raw_tags = []

          tags = []
          for tag in raw_tags:
              tag = clean(tag)
              tag = re.sub(r"[^A-Za-z0-9_#]", "", tag)
              if tag:
                  if not tag.startswith("#"):
                      tag = "#" + tag
                  if tag.lower() not in {x.lower() for x in tags}:
                      tags.append(tag)

          for required in [
              "#" + coin,
              "#CryptoNews" if MODE == "news"
              else "#CryptoEducation" if MODE == "education"
              else "#CryptoAnalysis"
          ]:
              if required.lower() not in {x.lower() for x in tags}:
                  tags.append(required)

          hashtags = tags[:5]

          def get_ticker():
              symbol = coin + "USDT"
              url = (
                  "https://api.binance.com/api/v3/ticker/24hr"
                  "?symbol=" + urllib.parse.quote(symbol)
              )
              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent":
                              "Mozilla/5.0 BinanceSquareV3"
                      }
                  )
                  with urllib.request.urlopen(req, timeout=15) as r:
                      t = json.load(r)
                  return {
                      "pair": pair,
                      "last": float(t["lastPrice"]),
                      "change": float(t["priceChangePercent"]),
                      "high": float(t["highPrice"]),
                      "low": float(t["lowPrice"]),
                  }
              except Exception as e:
                  print(
                      f"Ticker unavailable for {symbol}: "
                      f"{type(e).__name__}: {e}"
                  )
                  return {
                      "pair": pair,
                      "last": None,
                      "change": None,
                      "high": None,
                      "low": None,
                  }

          market = get_ticker()

          def add_footer(body, sources):
              body = clean(body)

              footer = [
                  "",
                  f"📊 Pair: {pair}",
                  " ".join(hashtags),
              ]

              if sources:
                  footer.append(
                      "Sources: " +
                      " • ".join(x["source"] for x in sources[:4])
                  )

              return (body[:1050] + "\n\n" + "\n".join(footer)).strip()

          sources = []
          seen_source = set()
          for item in news_items:
              if item["source"] not in seen_source:
                  sources.append(item)
                  seen_source.add(item["source"])
              if len(sources) >= 4:
                  break

          if MODE == "article":
              body = clean(data.get("article", ""))
              if len(body) < 1800:
                  raise SystemExit("Article generated too little content.")

              source_block = ""
              if sources:
                  source_block = (
                      "\n\nSources:\n" +
                      "\n".join(
                          f"{i}. {x['url']}"
                          for i, x in enumerate(sources, 1)
                      )
                  )

              content = (
                  body[:5400] +
                  f"\n\n📊 Pair: {pair}\n" +
                  " ".join(hashtags) +
                  source_block
              )
              title = headline

          else:
              body = clean(data.get("post", ""))
              if len(body) < 450:
                  raise SystemExit(
                      f"Generated post too short: {len(body)} chars"
                  )

              content = add_footer(body, sources)
              title = ""

          Path("content.txt").write_text(
              content, encoding="utf-8"
          )
          Path("title.txt").write_text(
              title, encoding="utf-8"
          )
          Path("headline.txt").write_text(
              headline[:120], encoding="utf-8"
          )
          Path("subheadline.txt").write_text(
              subheadline[:220], encoding="utf-8"
          )
          Path("takeaway.txt").write_text(
              takeaway[:250], encoding="utf-8"
          )
          Path("pair.txt").write_text(
              pair, encoding="utf-8"
          )
          Path("category.txt").write_text(
              category, encoding="utf-8"
          )
          Path("model.txt").write_text(
              model_used, encoding="utf-8"
          )
          Path("sources.json").write_text(
              json.dumps(
                  [
                      {
                          "name": x["source"],
                          "url": x["url"]
                      }
                      for x in sources
                  ],
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8"
          )
          Path("market.json").write_text(
              json.dumps(
                  market,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # Professional 1920x1080 visual.
          # This is generated locally with Pillow, so no image API
          # or extra paid key is required.
          # ---------------------------------------------------------
          W, H = 1920, 1080

          def ff(name, size):
              path = "/usr/share/fonts/truetype/dejavu/" + name
              try:
                  return ImageFont.truetype(path, size)
              except Exception:
                  return ImageFont.load_default()

          F_LABEL = ff("DejaVuSans-Bold.ttf", 34)
          F_TITLE = ff("DejaVuSans-Bold.ttf", 72)
          F_SUB = ff("DejaVuSans.ttf", 34)
          F_METRIC = ff("DejaVuSans-Bold.ttf", 45)
          F_SMALL = ff("DejaVuSans.ttf", 25)
          F_TINY = ff("DejaVuSans.ttf", 21)

          bg = (8, 12, 21)
          panel = (17, 24, 38)
          panel2 = (25, 34, 52)
          white = (244, 247, 252)
          muted = (166, 180, 198)
          accent = (36, 164, 255)
          green = (38, 195, 126)
          red = (235, 82, 82)

          im = Image.new("RGB", (W, H), bg)
          d = ImageDraw.Draw(im)

          # Frame and bands.
          d.rounded_rectangle(
              (40, 40, W - 40, H - 40),
              radius=34,
              fill=bg,
              outline=(43, 56, 79),
              width=3,
          )
          d.rectangle((0, 0, W, 14), fill=accent)
          d.rectangle((0, H - 12, W, H), fill=accent)

          label = (
              "TRENDING CRYPTO NEWS"
              if MODE == "news"
              else "CRYPTO EDUCATION"
              if MODE == "education"
              else "CRYPTO DEEP DIVE"
          )

          d.text(
              (90, 86),
              label,
              font=F_LABEL,
              fill=white
          )

          d.text(
              (W - 380, 92),
              PKT.strftime("%d %b %Y • PKT"),
              font=F_SMALL,
              fill=muted
          )

          d.line(
              (90, 155, W - 90, 155),
              fill=(52, 66, 90),
              width=3
          )

          title_lines = textwrap.wrap(
              headline,
              width=36
          )[:3]

          y = 205
          for line in title_lines:
              d.text(
                  (90, y),
                  line,
                  font=F_TITLE,
                  fill=white
              )
              y += 86

          sub_lines = textwrap.wrap(
              subheadline,
              width=74
          )[:2]

          y += 8
          for line in sub_lines:
              d.text(
                  (94, y),
                  line,
                  font=F_SUB,
                  fill=muted
              )
              y += 43

          # Category chip.
          chip_text = category.upper()
          chip_bbox = d.textbbox(
              (0, 0), chip_text, font=F_SMALL
          )
          chip_w = chip_bbox[2] - chip_bbox[0] + 54

          d.rounded_rectangle(
              (90, 580, 90 + chip_w, 640),
              radius=30,
              fill=panel2,
              outline=accent,
              width=2
          )

          d.text(
              (117, 595),
              chip_text,
              font=F_SMALL,
              fill=white
          )

          # Market panel.
          py = 675

          # Pair.
          d.rounded_rectangle(
              (90, py, 500, 860),
              radius=22,
              fill=panel
          )
          d.text(
              (120, py + 28),
              "MARKET REFERENCE",
              font=F_TINY,
              fill=muted
          )
          d.text(
              (120, py + 76),
              pair,
              font=F_METRIC,
              fill=white
          )

          # Last price.
          d.rounded_rectangle(
              (525, py, 920, 860),
              radius=22,
              fill=panel
          )
          d.text(
              (555, py + 28),
              "LAST PRICE",
              font=F_TINY,
              fill=muted
          )

          if market["last"] is None:
              price_text = "N/A"
          else:
              p = market["last"]
              if p >= 1000:
                  price_text = f"{p:,.2f}"
              elif p >= 1:
                  price_text = f"{p:,.4f}"
              else:
                  price_text = f"{p:,.8f}".rstrip("0")

          d.text(
              (555, py + 76),
              price_text,
              font=F_METRIC,
              fill=white
          )

          # Change.
          d.rounded_rectangle(
              (945, py, 1340, 860),
              radius=22,
              fill=panel
          )
          d.text(
              (975, py + 28),
              "24H CHANGE",
              font=F_TINY,
              fill=muted
          )

          if market["change"] is None:
              change_text = "N/A"
              change_fill = muted
          else:
              change_text = f"{market['change']:+.2f}%"
              change_fill = (
                  green if market["change"] >= 0 else red
              )

          d.text(
              (975, py + 76),
              change_text,
              font=F_METRIC,
              fill=change_fill
          )

          # Why it matters.
          d.rounded_rectangle(
              (1365, py, 1830, 860),
              radius=22,
              fill=panel
          )
          d.text(
              (1395, py + 28),
              "WHY IT MATTERS",
              font=F_TINY,
              fill=muted
          )

          takeaway_lines = textwrap.wrap(
              takeaway,
              width=20
          )[:5]

          yy = py + 76
          for line in takeaway_lines:
              d.text(
                  (1395, yy),
                  line,
                  font=F_SMALL,
                  fill=white
              )
              yy += 34

          # High / low bar.
          if market["high"] is not None and market["low"] is not None:
              d.text(
                  (90, 900),
                  f"24H HIGH  {market['high']:,.4f}",
                  font=F_SMALL,
                  fill=muted
              )
              d.text(
                  (470, 900),
                  f"24H LOW  {market['low']:,.4f}",
                  font=F_SMALL,
                  fill=muted
              )

          source_names = " • ".join(
              x["source"] for x in sources[:4]
          ) if sources else "Educational content"

          d.text(
              (90, 960),
              "Sources: " + source_names,
              font=F_TINY,
              fill=muted
          )

          tag_text = " ".join(hashtags[:4])
          tag_bbox = d.textbbox(
              (0, 0), tag_text, font=F_TINY
          )

          d.text(
              (W - 95 - (tag_bbox[2] - tag_bbox[0]), 960),
              tag_text,
              font=F_TINY,
              fill=accent
          )

          d.text(
              (90, 1000),
              "BINANCE SQUARE • AI CRYPTO PUBLISHER V3",
              font=F_TINY,
              fill=(115, 131, 153)
          )

          im.save(
              "square_visual.png",
              "PNG",
              optimize=True
          )

          im.save(
              "article_cover.png",
              "PNG",
              optimize=True
          )

          print("")
          print("V3 content ready.")
          print("Mode:", MODE)
          print("Gemini:", model_used)
          print("Pair:", pair)
          print("Content chars:", len(content))
          print("Image: 1920x1080")
          print("")
          print(content)
          PY

      - name: Download official Binance Square skill
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/binance/binance-skills-hub.git

          node --version

      - name: Publish to Binance Square
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$BINANCE_SQUARE_OPENAPI_KEY" ]; then
            echo "BINANCE_SQUARE_OPENAPI_KEY is missing."
            exit 1
          fi

          SKILL="$GITHUB_WORKSPACE/binance-skills-hub/skills/binance/square-post"

          cd "$SKILL"

          if [ "$CONTENT_MODE" = "article" ]; then
            echo "Publishing V3 article..."

            node scripts/post-image.mjs \
              --text "$(cat "$GITHUB_WORKSPACE/content.txt")" \
              --title "$(cat "$GITHUB_WORKSPACE/title.txt")" \
              --cover "$GITHUB_WORKSPACE/article_cover.png"
          else
            echo "Publishing V3 image post..."

            node scripts/post-image.mjs \
              --text "$(cat "$GITHUB_WORKSPACE/content.txt")" \
              --images "$GITHUB_WORKSPACE/square_visual.png"
          fi

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Binance Square Publisher V3"
            echo ""
            echo "- Mode: \`$CONTENT_MODE\`"
            [ -f model.txt ] && echo "- Gemini: \`$(cat model.txt)\`"
            [ -f pair.txt ] && echo "- Pair: \`$(cat pair.txt)\`"
            [ -f content.txt ] && echo "- Characters: $(wc -m < content.txt)"
            echo "- Visual: 1920x1080"
          } >> "$GITHUB_STEP_SUMMARY"
