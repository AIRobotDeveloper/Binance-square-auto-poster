name: Binance Square Auto Publisher V5

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Test content type"
        required: true
        type: choice
        default: news
        options:
          - news
          - education
          - article

  schedule:
    - cron: "5 4 * * *"
    - cron: "5 9 * * *"
    - cron: "5 15 * * *"

permissions:
  contents: read

concurrency:
  group: binance-square-v5
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      INPUT_MODE: ${{ inputs.mode }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}

    steps:
      # Required: GitHub Actions runners start in a clean workspace.
      # Checkout makes the repository's scripts/ directory available.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify repository files
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/binance-square-auto-poster.yml
          test -f scripts/generate_square_content.py
          echo "Repository checkout verified."
          echo "Generator: scripts/generate_square_content.py"

      - name: Select mode
        shell: bash
        run: |
          set -euo pipefail

          MODE="${INPUT_MODE:-}"

          if [ -z "$MODE" ]; then
            case "$EVENT_SCHEDULE" in
              "5 4 * * *") MODE="news" ;;
              "5 9 * * *") MODE="education" ;;
              "5 15 * * *") MODE="article" ;;
              *)
                H=$(TZ=Asia/Karachi date +%H)
                if [ "$H" -lt 12 ]; then MODE="news"
                elif [ "$H" -lt 18 ]; then MODE="education"
                else MODE="article"
                fi
                ;;
            esac
          fi

          case "$MODE" in
            news|education|article) ;;
            *)
              echo "Unsupported mode: $MODE"
              exit 1
              ;;
          esac

          echo "CONTENT_MODE=$MODE" >> "$GITHUB_ENV"
          echo "Mode: $MODE"

      - name: Install image and feed tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir Pillow

      - name: Generate editorial content + V5 premium visual
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_square_content.py

          test -s content.txt
          test -s square_visual.jpg

          if [ "$CONTENT_MODE" = "article" ]; then
            test -s title.txt
            test -s article_cover.jpg
          fi

          echo "Generation outputs verified."

      - name: Download official Binance Square skill
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/binance/binance-skills-hub.git
          node --version
          test -f binance-skills-hub/skills/binance/square-post/scripts/post-image.mjs

      - name: Publish to Binance Square
        shell: bash
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$BINANCE_SQUARE_OPENAPI_KEY" ]; then
            echo "BINANCE_SQUARE_OPENAPI_KEY is missing."
            exit 1
          fi

          SKILL="$GITHUB_WORKSPACE/binance-skills-hub/skills/binance/square-post"
          cd "$SKILL"

          if [ "$CONTENT_MODE" = "article" ]; then
            node scripts/post-image.mjs \
              --text "$(cat "$GITHUB_WORKSPACE/content.txt")" \
              --title "$(cat "$GITHUB_WORKSPACE/title.txt")" \
              --cover "$GITHUB_WORKSPACE/article_cover.jpg"
          else
            node scripts/post-image.mjs \
              --text "$(cat "$GITHUB_WORKSPACE/content.txt")" \
              --images "$GITHUB_WORKSPACE/square_visual.jpg"
          fi

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Binance Square Publisher V5"
            echo ""
            echo "- Mode: \`$CONTENT_MODE\`"
            if [ -f model.txt ]; then
              echo "- Gemini: \`$(cat model.txt)\`"
            fi
            if [ -f pair.txt ] && [ -n "$(cat pair.txt)" ]; then
              echo "- Pair: \`$(cat pair.txt)\`"
            fi
            if [ -f content.txt ]; then
              echo "- Content: $(wc -m < content.txt) characters"
            fi
            echo "- Visual: 1920×1080 JPEG"
            if [ -f visual_theme.txt ]; then
              echo "- Visual theme: \`$(cat visual_theme.txt)\`"
            fi
            if [ -f visual_source.txt ]; then
              echo "- Visual source: $(cat visual_source.txt)"
            fi
            echo "- Image engine: premium deterministic composition + post-processing"
            echo "- Template engine: structured editorial layout"
            echo "- Color engine: dynamic category/sentiment palette"
          } >> "$GITHUB_STEP_SUMMARY"
