name: Binance Square Auto Publisher V2.1

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Choose what to publish
        required: true
        type: choice
        default: auto
        options:
          - auto
          - news
          - education
          - article

  schedule:
    # 09:05 Pakistan time (UTC+5)
    - cron: "5 4 * * *"
    # 14:05 Pakistan time (UTC+5)
    - cron: "5 9 * * *"
    # 20:05 Pakistan time (UTC+5)
    - cron: "5 15 * * *"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
      REQUESTED_MODE: ${{ inputs.mode }}
      SCHEDULE_EXPRESSION: ${{ github.event.schedule }}

    steps:
      - name: Select content mode
        shell: bash
        run: |
          set -euo pipefail
          MODE="${REQUESTED_MODE:-}"

          if [[ -z "$MODE" || "$MODE" == "auto" ]]; then
            case "${SCHEDULE_EXPRESSION:-}" in
              "5 4 * * *") MODE="news" ;;
              "5 9 * * *") MODE="education" ;;
              "5 15 * * *") MODE="article" ;;
              *)
                HOUR=$(TZ=Asia/Karachi date +%H)
                if (( HOUR < 12 )); then
                  MODE="news"
                elif (( HOUR < 18 )); then
                  MODE="education"
                else
                  MODE="article"
                fi
                ;;
            esac
          fi

          case "$MODE" in
            news|education|article) ;;
            *) echo "Invalid mode: $MODE"; exit 1 ;;
          esac

          echo "MODE=$MODE" >> "$GITHUB_ENV"
          printf '%s' "$MODE" > mode.txt
          echo "Selected mode: $MODE"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install image tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir Pillow

      - name: Generate AI content
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo "GEMINI_API_KEY is missing."
            exit 1
          fi

          python3 - <<'PY'
          import datetime as dt
          import email.utils
          import html
          import json
          import os
          import re
          import socket
          import time
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET

          API_KEY = os.environ["GEMINI_API_KEY"].strip()
          MODE = open("mode.txt", encoding="utf-8").read().strip()

          # Ordered fallback chain. The workflow never publishes multiple
          # posts for one run: the first successful model is used.
          MODELS = [
              "gemini-3.5-flash-lite",
              "gemini-3.7-flash",
              "gemini-3.6-flash",
          ]

          RSS_FEEDS = [
              ("CoinDesk", "https://www.coindesk.com/arc/outboundfeeds/rss/"),
              ("Cointelegraph", "https://cointelegraph.com/rss"),
              ("Decrypt", "https://decrypt.co/feed"),
              ("The Block", "https://www.theblock.co/rss.xml"),
              ("Bitcoin Magazine", "https://bitcoinmagazine.com/.rss/full/"),
              ("Google News Crypto", "https://news.google.com/rss/search?q=crypto%20bitcoin%20ethereum&hl=en-US&gl=US&ceid=US:en"),
          ]

          # Deterministic pair mapping avoids inventing random trading pairs.
          PAIR_RULES = [
              (("bitcoin", "btc"), "BTC/USDT", "BTC"),
              (("ethereum", "eth"), "ETH/USDT", "ETH"),
              (("bnb", "binance coin"), "BNB/USDT", "BNB"),
              (("solana", "sol"), "SOL/USDT", "SOL"),
              (("xrp", "ripple"), "XRP/USDT", "XRP"),
              (("dogecoin", "doge"), "DOGE/USDT", "DOGE"),
              (("cardano", "ada"), "ADA/USDT", "ADA"),
              (("avalanche", "avax"), "AVAX/USDT", "AVAX"),
              (("chainlink", "link"), "LINK/USDT", "LINK"),
              (("tron", "trx"), "TRX/USDT", "TRX"),
              (("toncoin", "ton"), "TON/USDT", "TON"),
              (("sui",), "SUI/USDT", "SUI"),
              (("shiba inu", "shib"), "SHIB/USDT", "SHIB"),
              (("polkadot", "dot"), "DOT/USDT", "DOT"),
              (("uniswap", "uni"), "UNI/USDT", "UNI"),
          ]

          HASHTAG_RULES = [
              (("bitcoin", "btc"), ["#Bitcoin", "#BTC", "#Crypto"]),
              (("ethereum", "eth"), ["#Ethereum", "#ETH", "#Crypto"]),
              (("bnb", "binance"), ["#BNB", "#Binance", "#Crypto"]),
              (("solana", "sol"), ["#Solana", "#SOL", "#Crypto"]),
              (("xrp", "ripple"), ["#XRP", "#Ripple", "#Crypto"]),
              (("defi",), ["#DeFi", "#Blockchain", "#Crypto"]),
              (("regulation", "sec", "law"), ["#CryptoRegulation", "#Blockchain", "#Crypto"]),
              (("stablecoin",), ["#Stablecoins", "#DeFi", "#Crypto"]),
              (("security", "hack", "exploit"), ["#CryptoSecurity", "#Blockchain", "#Crypto"]),
          ]

          def clean_text(value):
              value = html.unescape(value or "")
              value = re.sub(r"<script[^>]*>.*?</script>", " ", value, flags=re.I | re.S)
              value = re.sub(r"<style[^>]*>.*?</style>", " ", value, flags=re.I | re.S)
              value = re.sub(r"<[^>]+>", " ", value)
              return re.sub(r"\s+", " ", value).strip()

          def local_name(tag):
              return tag.split("}", 1)[-1]

          def child_text(element, wanted):
              for child in element:
                  if local_name(child.tag).lower() == wanted.lower():
                      return clean_text(child.text)
              return ""

          def parse_date(value):
              if not value:
                  return dt.datetime.now(dt.timezone.utc)
              try:
                  d = email.utils.parsedate_to_datetime(value)
                  return (d if d.tzinfo else d.replace(tzinfo=dt.timezone.utc)).astimezone(dt.timezone.utc)
              except Exception:
                  return dt.datetime.now(dt.timezone.utc)

          def fetch_feed(source, url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 BinanceSquareAutoPublisher/2.1",
                      "Accept": "application/rss+xml, application/xml, text/xml, */*",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      raw = response.read()
                  root = ET.fromstring(raw)
              except Exception as exc:
                  print(f"Feed failed: {source}: {type(exc).__name__}: {exc}")
                  return []

              items = []

              # RSS items
              for element in root.iter():
                  if local_name(element.tag).lower() != "item":
                      continue
                  title = child_text(element, "title")
                  link = child_text(element, "link")
                  desc = child_text(element, "description") or child_text(element, "summary")
                  published = child_text(element, "pubDate") or child_text(element, "published") or child_text(element, "updated")
                  if title and link:
                      items.append({
                          "source": source,
                          "title": title,
                          "summary": desc[:900],
                          "url": link,
                          "published": parse_date(published),
                      })

              # Atom entries fallback
              if not items:
                  for element in root.iter():
                      if local_name(element.tag).lower() != "entry":
                          continue
                      title = child_text(element, "title")
                      summary = child_text(element, "summary") or child_text(element, "content")
                      published = child_text(element, "published") or child_text(element, "updated")
                      link = ""
                      for child in element:
                          if local_name(child.tag).lower() == "link" and child.attrib.get("href"):
                              link = child.attrib["href"]
                              break
                      if title and link:
                          items.append({
                              "source": source,
                              "title": title,
                              "summary": summary[:900],
                              "url": link,
                              "published": parse_date(published),
                          })
              return items

          def token_set(text):
              return set(re.findall(r"[a-z0-9$]+", text.lower()))

          def choose_pair(text):
              blob = text.lower()
              for words, pair, ticker in PAIR_RULES:
                  if any(w in blob for w in words):
                      return pair, ticker
              return "BTC/USDT", "BTC"

          def choose_hashtags(text, mode):
              blob = text.lower()
              for words, tags in HASHTAG_RULES:
                  if any(w in blob for w in words):
                      base = tags[:]
                      break
              else:
                  base = ["#Crypto", "#Blockchain", "#BinanceSquare"]

              if mode == "news" and "#CryptoNews" not in base:
                  base[-1] = "#CryptoNews"
              if mode == "education":
                  base = ["#CryptoEducation", "#Blockchain", "#BinanceSquare"]
              return base[:3]

          def gather_news():
              now = dt.datetime.now(dt.timezone.utc)
              cutoff = now - dt.timedelta(hours=48)
              all_items = []

              for source, url in RSS_FEEDS:
                  all_items.extend(fetch_feed(source, url))

              # Remove duplicates and stale stories.
              unique = []
              seen = set()
              for item in all_items:
                  if item["url"] in seen:
                      continue
                  seen.add(item["url"])
                  if item["published"] >= cutoff:
                      unique.append(item)

              if not unique:
                  unique = list({i["url"]: i for i in all_items}.values())

              crypto_terms = [
                  "bitcoin", "btc", "ethereum", "eth", "bnb", "binance", "solana",
                  "xrp", "crypto", "blockchain", "defi", "stablecoin", "etf", "sec",
                  "regulation", "hack", "exploit", "wallet", "exchange", "token",
              ]

              def score(item):
                  blob = (item["title"] + " " + item["summary"]).lower()
                  keyword = sum(2 for term in crypto_terms if term in blob)
                  age_hours = max(0.0, (now - item["published"]).total_seconds() / 3600)
                  recency = max(0.0, 48.0 - age_hours)
                  return recency + keyword * 3

              for item in unique:
                  item["score"] = score(item)
              unique.sort(key=lambda x: x["score"], reverse=True)
              return unique[:12]

          def extract_json(text):
              text = re.sub(r"^```(?:json)?\s*", "", text.strip(), flags=re.I)
              text = re.sub(r"\s*```$", "", text)
              start, end = text.find("{"), text.rfind("}")
              if start == -1 or end == -1:
                  raise ValueError("Gemini did not return a JSON object.")
              return json.loads(text[start:end + 1])

          def gemini(prompt, max_tokens=1400):
              last_errors = []
              for model in MODELS:
                  print(f"Trying Gemini model: {model}")
                  url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
                  body = {
                      "contents": [{"parts": [{"text": prompt}]}],
                      "generationConfig": {
                          "temperature": 0.75,
                          "maxOutputTokens": max_tokens,
                      },
                  }
                  request = urllib.request.Request(
                      url,
                      data=json.dumps(body).encode("utf-8"),
                      headers={
                          "Content-Type": "application/json",
                          "x-goog-api-key": API_KEY,
                      },
                      method="POST",
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=45) as response:
                          result = json.load(response)
                      text = "".join(
                          part.get("text", "")
                          for part in result.get("candidates", [])[0].get("content", {}).get("parts", [])
                      ).strip()
                      if not text:
                          raise ValueError("Gemini returned empty text")
                      print(f"SUCCESS with {model}")
                      return text, model
                  except urllib.error.HTTPError as exc:
                      detail = exc.read().decode("utf-8", errors="replace")
                      msg = f"{model}: HTTP {exc.code}: {detail[:500]}"
                      print(msg)
                      last_errors.append(msg)
                      if exc.code in {429, 500, 502, 503, 504}:
                          time.sleep(2)
                  except (TimeoutError, socket.timeout) as exc:
                      msg = f"{model}: timeout: {exc}"
                      print(msg)
                      last_errors.append(msg)
                  except Exception as exc:
                      msg = f"{model}: {type(exc).__name__}: {exc}"
                      print(msg)
                      last_errors.append(msg)
              raise SystemExit("All Gemini models failed:\n" + "\n".join(last_errors))

          def add_metadata(base, pair, tags, max_chars=480):
              base = re.sub(r"\s+", " ", base.strip())
              base = re.sub(r"(?:#\w+\s*)+$", "", base).strip()
              metadata = f"\n\n📊 Pair: {pair}\n{' '.join(tags)}"
              available = max_chars - len(metadata)
              if len(base) > available:
                  base = base[:max(available - 1, 1)].rstrip(" .,;:") + "…"
              return base + metadata

          news = gather_news() if MODE in {"news", "article"} else []
          news_json = json.dumps([
              {
                  "source": x["source"],
                  "title": x["title"],
                  "summary": x["summary"],
                  "published_utc": x["published"].isoformat(),
                  "url": x["url"],
              }
              for x in news
          ], ensure_ascii=False, indent=2)

          if MODE == "news":
              prompt = f"""
          You are the editor of a professional Binance Square crypto account.

          Current date/time in Pakistan: {dt.datetime.now(dt.timezone.utc) + dt.timedelta(hours=5)}

          Here are fresh crypto headlines from public RSS feeds:
          {news_json}

          Choose ONE strongest and most useful current story.
          Do not invent facts, quotes, statistics, prices, partnerships, or events.
          Clearly mark a report/rumor as reported or unconfirmed when necessary.
          Do not give financial advice, buy/sell instructions, profit promises, or price targets.

          Write a substantial but readable short post: target 300-360 characters BEFORE the
          pair line and hashtags. Use 2-4 short paragraphs or bullets when helpful.

          Return ONLY JSON:
          {{
            "title": "headline",
            "post": "300-360 character post without hashtags and without a pair line",
            "image_headline": "short strong headline",
            "image_subtitle": "one concise factual subtitle",
            "pair": "choose exactly one relevant pair from BTC/USDT, ETH/USDT, BNB/USDT, SOL/USDT, XRP/USDT, DOGE/USDT, ADA/USDT, AVAX/USDT, LINK/USDT, TRX/USDT, TON/USDT, SUI/USDT, SHIB/USDT, DOT/USDT, UNI/USDT"
          }}
          """
              raw, model = gemini(prompt, 850)
              data = extract_json(raw)
              title = str(data.get("title", "Crypto News")).strip()
              post = str(data.get("post", "")).strip()
              headline = str(data.get("image_headline", title)).strip()
              subtitle = str(data.get("image_subtitle", "Latest verified crypto update")).strip()
              pair = str(data.get("pair", "BTC/USDT")).strip()
              if pair not in {x[1] for x in PAIR_RULES}:
                  pair = choose_pair(title + " " + post)[0]
              tags = choose_hashtags(title + " " + post, "news")
              final_post = add_metadata(post, pair, tags)

              # Use the selected story link as the primary source.
              primary = news[0]["url"] if news else ""
              sources = []
              if primary:
                  sources.append(primary)
              for item in news:
                  if item["url"] not in sources and len(sources) < 4:
                      sources.append(item["url"])

              open("post.txt", "w", encoding="utf-8").write(final_post)
              open("content_title.txt", "w", encoding="utf-8").write(title[:120])
              open("image_headline.txt", "w", encoding="utf-8").write(headline[:90])
              open("image_subtitle.txt", "w", encoding="utf-8").write(subtitle[:180])
              open("pair.txt", "w", encoding="utf-8").write(pair)
              open("hashtags.txt", "w", encoding="utf-8").write(" ".join(tags))
              open("sources.txt", "w", encoding="utf-8").write("\n".join(sources))
              open("ai_model.txt", "w", encoding="utf-8").write(model)

          elif MODE == "education":
              topics = [
                  ("risk management", "BTC/USDT"),
                  ("spot vs futures", "BTC/USDT"),
                  ("wallet security", "BTC/USDT"),
                  ("stablecoins", "USDT/USDC"),
                  ("Ethereum gas fees", "ETH/USDT"),
                  ("BNB ecosystem basics", "BNB/USDT"),
                  ("Solana fundamentals", "SOL/USDT"),
                  ("trading psychology", "BTC/USDT"),
                  ("DeFi basics", "ETH/USDT"),
                  ("crypto scams and phishing", "BTC/USDT"),
                  ("self-custody and private keys", "BTC/USDT"),
                  ("market liquidity", "BTC/USDT"),
              ]
              day = dt.datetime.now(dt.timezone.utc).timetuple().tm_yday
              topic, default_pair = topics[day % len(topics)]

              prompt = f"""
          You are a crypto educator writing for Binance Square.
          Create one genuinely useful educational post about: {topic}

          Target 300-360 characters BEFORE the pair line and hashtags.
          Explain one concept clearly using practical language.
          No financial advice, profit promises, price targets, or buy/sell instructions.
          Do not invent statistics.

          Return ONLY JSON:
          {{
            "post": "300-360 character educational post without hashtags or pair line",
            "image_headline": "short educational headline",
            "image_subtitle": "one clear takeaway",
            "pair": "exactly one of BTC/USDT, ETH/USDT, BNB/USDT, SOL/USDT, XRP/USDT"
          }}
          """
              raw, model = gemini(prompt, 700)
              data = extract_json(raw)
              post = str(data.get("post", "")).strip()
              pair = str(data.get("pair", default_pair)).strip()
              if pair not in {"BTC/USDT", "ETH/USDT", "BNB/USDT", "SOL/USDT", "XRP/USDT"}:
                  pair = default_pair
              tags = choose_hashtags(topic, "education")
              final_post = add_metadata(post, pair, tags)

              open("post.txt", "w", encoding="utf-8").write(final_post)
              open("content_title.txt", "w", encoding="utf-8").write("Crypto Education")
              open("image_headline.txt", "w", encoding="utf-8").write(str(data.get("image_headline", topic)).strip()[:90])
              open("image_subtitle.txt", "w", encoding="utf-8").write(str(data.get("image_subtitle", "Learn one useful concept today")).strip()[:180])
              open("pair.txt", "w", encoding="utf-8").write(pair)
              open("hashtags.txt", "w", encoding="utf-8").write(" ".join(tags))
              open("sources.txt", "w", encoding="utf-8").write("Educational content — no external source required")
              open("ai_model.txt", "w", encoding="utf-8").write(model)

          elif MODE == "article":
              prompt = f"""
          You are a professional crypto research writer for Binance Square.

          Current Pakistan date/time: {dt.datetime.now(dt.timezone.utc) + dt.timedelta(hours=5)}

          Recent news material:
          {news_json}

          Select ONE meaningful story or theme and write an original long-form article.
          Target 2800-4200 characters.
          Include these sections with clear headings:
          1. What happened
          2. Why it matters
          3. Market context
          4. What to watch next
          5. Conclusion

          Use only facts supported by the supplied source material.
          Clearly label reports/uncertainty.
          No fabricated numbers or quotes.
          No financial advice, buy/sell commands, guaranteed returns, or price predictions.

          Return ONLY JSON:
          {{
            "title": "article title",
            "article": "full article body",
            "image_headline": "short cover headline",
            "image_subtitle": "short factual cover subtitle",
            "pair": "one of BTC/USDT, ETH/USDT, BNB/USDT, SOL/USDT, XRP/USDT, DOGE/USDT, ADA/USDT, AVAX/USDT, LINK/USDT, TRX/USDT, TON/USDT, SUI/USDT, SHIB/USDT, DOT/USDT, UNI/USDT"
          }}
          """
              raw, model = gemini(prompt, 2200)
              data = extract_json(raw)
              title = str(data.get("title", "Crypto Deep Dive")).strip()
              article = str(data.get("article", "")).strip()
              pair = str(data.get("pair", "BTC/USDT")).strip()
              if pair not in {x[1] for x in PAIR_RULES}:
                  pair = choose_pair(title + " " + article)[0]

              sources = []
              for item in news:
                  if item["url"] not in sources and len(sources) < 5:
                      sources.append(item["url"])

              if sources:
                  article += "\n\nSources\n" + "\n".join(f"{i}. {u}" for i, u in enumerate(sources, 1))

              open("post.txt", "w", encoding="utf-8").write(article[:6000])
              open("article.txt", "w", encoding="utf-8").write(article[:6000])
              open("content_title.txt", "w", encoding="utf-8").write(title[:120])
              open("image_headline.txt", "w", encoding="utf-8").write(str(data.get("image_headline", title)).strip()[:90])
              open("image_subtitle.txt", "w", encoding="utf-8").write(str(data.get("image_subtitle", pair)).strip()[:180])
              open("pair.txt", "w", encoding="utf-8").write(pair)
              open("hashtags.txt", "w", encoding="utf-8").write("#CryptoNews #Blockchain #BinanceSquare")
              open("sources.txt", "w", encoding="utf-8").write("\n".join(sources))
              open("ai_model.txt", "w", encoding="utf-8").write(model)

          print("\n===== FINAL MODE =====")
          print(MODE)
          print("===== AI MODEL =====")
          print(open("ai_model.txt", encoding="utf-8").read())
          print("===== PAIR =====")
          print(open("pair.txt", encoding="utf-8").read())
          print("===== HASHTAGS =====")
          print(open("hashtags.txt", encoding="utf-8").read())
          print("===== POST PREVIEW =====")
          print(open("post.txt", encoding="utf-8").read())
          PY

      - name: Create high-resolution visual
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          import datetime as dt
          import os
          import textwrap

          W, H = 1920, 1080
          mode = open("mode.txt", encoding="utf-8").read().strip()
          headline = open("image_headline.txt", encoding="utf-8").read().strip()
          subtitle = open("image_subtitle.txt", encoding="utf-8").read().strip()
          pair = open("pair.txt", encoding="utf-8").read().strip()
          hashtags = open("hashtags.txt", encoding="utf-8").read().strip()
          sources = open("sources.txt", encoding="utf-8").read().strip().splitlines()

          if mode == "news":
              label, badge = "TRENDING CRYPTO NEWS", "NEWS"
          elif mode == "article":
              label, badge = "CRYPTO DEEP DIVE", "ARTICLE"
          else:
              label, badge = "CRYPTO EDUCATION", "LEARN"

          # High-quality dark background with a smooth horizontal gradient.
          img = Image.new("RGB", (W, H))
          px = img.load()
          left = (10, 16, 28)
          right = (22, 30, 52)
          accent = (52, 181, 246)

          for x in range(W):
              t = x / (W - 1)
              c = tuple(int(left[i] * (1-t) + right[i] * t) for i in range(3))
              for y in range(H):
                  px[x, y] = c

          draw = ImageDraw.Draw(img, "RGBA")

          # Subtle glowing circles and grid.
          glow = Image.new("RGBA", (W, H), (0, 0, 0, 0))
          gd = ImageDraw.Draw(glow, "RGBA")
          gd.ellipse((1320, -180, 2140, 640), fill=(52, 181, 246, 42))
          gd.ellipse((-280, 700, 540, 1320), fill=(124, 92, 255, 30))
          glow = glow.filter(ImageFilter.GaussianBlur(70))
          img = Image.alpha_composite(img.convert("RGBA"), glow)
          draw = ImageDraw.Draw(img, "RGBA")

          for x in range(0, W, 96):
              draw.line((x, 0, x, H), fill=(255,255,255,8), width=1)
          for y in range(0, H, 96):
              draw.line((0, y, W, y), fill=(255,255,255,8), width=1)

          font_candidates = [
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf",
          ]
          regular_candidates = [
              "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
              "/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf",
          ]

          def load_font(paths, size):
              for p in paths:
                  if os.path.exists(p):
                      return ImageFont.truetype(p, size)
              return ImageFont.load_default()

          label_font = load_font(font_candidates, 42)
          title_font = load_font(font_candidates, 90)
          title_font_small = load_font(font_candidates, 72)
          subtitle_font = load_font(regular_candidates, 38)
          pair_font = load_font(font_candidates, 42)
          small_font = load_font(regular_candidates, 25)
          badge_font = load_font(font_candidates, 28)

          # Top brand strip.
          draw.rounded_rectangle((90, 70, 650, 140), radius=24, fill=(255,255,255,14), outline=(255,255,255,28), width=2)
          draw.text((120, 85), label, font=label_font, fill=(240,248,255,255))

          # Coin/pair badge.
          draw.rounded_rectangle((1460, 72, 1810, 150), radius=24, fill=(52,181,246,40), outline=(52,181,246,150), width=2)
          draw.text((1500, 93), pair, font=pair_font, fill=(230,248,255,255))

          # Main title card.
          card = (90, 215, 1830, 790)
          draw.rounded_rectangle(card, radius=42, fill=(6,12,24,175), outline=(255,255,255,28), width=2)

          # Accent bar.
          draw.rounded_rectangle((130, 260, 150, 730), radius=10, fill=accent + (255,))

          # Dynamic title wrapping.
          max_chars = 25 if len(headline) > 25 else 30
          lines = textwrap.wrap(headline, width=max_chars)
          tf = title_font if len(lines) <= 2 else title_font_small
          y = 285
          for line in lines[:3]:
              draw.text((205, y), line, font=tf, fill=(255,255,255,255))
              y += 105 if tf == title_font else 88

          y += 15
          for line in textwrap.wrap(subtitle, width=62)[:3]:
              draw.text((205, y), line, font=subtitle_font, fill=(195,210,228,255))
              y += 50

          # Footer metadata.
          pkt = dt.datetime.now(dt.timezone.utc) + dt.timedelta(hours=5)
          date_text = pkt.strftime("%d %b %Y • %I:%M %p PKT")
          source_text = sources[0][:65] if sources else "Binance Square AI Publisher"

          draw.rounded_rectangle((205, 665, 710, 738), radius=20, fill=(255,255,255,10))
          draw.text((230, 683), f"{badge}  •  {date_text}", font=small_font, fill=(175,191,211,255))

          draw.text((205, 755), source_text, font=small_font, fill=(142,162,187,255))
          draw.text((205, 805), hashtags[:105], font=small_font, fill=(122,184,230,255))

          # Decorative line graph / market motif, purely visual.
          pts = [(1450, 650), (1520, 590), (1590, 625), (1660, 525), (1730, 555), (1800, 455)]
          draw.line(pts, fill=(52,181,246,190), width=8, joint="curve")
          for x, y in pts:
              draw.ellipse((x-9, y-9, x+9, y+9), fill=(225,245,255,255))

          # Bottom right branding.
          draw.text((1470, 920), "BINANCE SQUARE", font=label_font, fill=(205,220,235,220))
          draw.text((1470, 975), "AI • NEWS • EDUCATION", font=small_font, fill=(130,155,180,210))

          # Export at full resolution; additionally create an optimized 1600x900 version.
          img = img.convert("RGB")
          img.save("square_visual_1920x1080.png", "PNG", optimize=True)
          img.resize((1600, 900), Image.Resampling.LANCZOS).save("square_visual.png", "PNG", optimize=True)
          img.resize((1600, 900), Image.Resampling.LANCZOS).save("article_cover.png", "PNG", optimize=True)

          print("Created 1920x1080 master image and 1600x900 upload images.")
          PY

      - name: Download official Binance Square skill
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/binance/binance-skills-hub.git
          cd binance-skills-hub/skills/binance/square-post
          node --version

      - name: Publish to Binance Square
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${BINANCE_SQUARE_OPENAPI_KEY:-}" ]]; then
            echo "BINANCE_SQUARE_OPENAPI_KEY is missing."
            exit 1
          fi

          cd "$GITHUB_WORKSPACE/binance-skills-hub/skills/binance/square-post"

          case "$(cat "$GITHUB_WORKSPACE/mode.txt")" in
            news|education)
              echo "Publishing image post..."
              node scripts/post-image.mjs \
                --text "$(cat "$GITHUB_WORKSPACE/post.txt")" \
                --images "$GITHUB_WORKSPACE/square_visual.png"
              ;;

            article)
              echo "Publishing article with cover..."
              node scripts/post-image.mjs \
                --text "$(cat "$GITHUB_WORKSPACE/article.txt")" \
                --title "$(cat "$GITHUB_WORKSPACE/content_title.txt")" \
                --cover "$GITHUB_WORKSPACE/article_cover.png"
              ;;

            *)
              echo "Unsupported mode."
              exit 1
              ;;
          esac
