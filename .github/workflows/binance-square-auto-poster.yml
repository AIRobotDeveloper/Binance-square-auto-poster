name: AI Binance Square Auto Poster

on:
  workflow_dispatch:
  schedule:
    - cron: "5 4 * * *"
    - cron: "5 9 * * *"
    - cron: "5 15 * * *"

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate AI post with automatic Gemini fallback
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is missing."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          import socket

          api_key = os.environ["GEMINI_API_KEY"].strip()

          models = [
              "gemini-3.5-flash-lite",
              "gemini-3.1-flash-lite",
              "gemini-3.8-flash",
              "Gemini 2.5 Flash Lite",
              "Gemini 2.5 Flash",
              "Gemini 3 Flash",
              "Gemini 3.5 Flash Lite",
              "Gemini 3.7 Flash",
              "Gemini 3.6 Flash",
          ]

          prompt = """
          Write ONE useful and engaging Binance Square post about cryptocurrency
          education, blockchain, trading psychology, risk management, or market
          awareness.

          Rules:
          - Maximum 400 characters.
          - Original and easy to understand.
          - No guaranteed profits.
          - No financial advice.
          - No fake statistics or fake news.
          - No price predictions.
          - Professional but engaging.
          - Maximum 3 hashtags.
          - Return ONLY the post.
          """

          data = {
              "contents": [
                  {
                      "parts": [
                          {"text": prompt}
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.8,
                  "maxOutputTokens": 180
              }
          }

          post = None

          for model in models:
              print(f"Trying Gemini model: {model}")

              url = (
                  "https://generativelanguage.googleapis.com/v1beta/"
                  f"models/{model}:generateContent"
              )

              request = urllib.request.Request(
                  url,
                  data=json.dumps(data).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "x-goog-api-key": api_key
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      result = json.load(response)

                  post = (
                      result["candidates"][0]["content"]["parts"][0]["text"]
                      .strip()
                  )

                  if post and len(post) <= 400:
                      print(f"SUCCESS with {model}")
                      break

                  print(f"{model} returned invalid/too-long output.")

              except urllib.error.HTTPError as e:
                  detail = e.read().decode("utf-8", errors="replace")
                  print(f"{model} failed with HTTP {e.code}")
                  print(detail[:700])

              except (TimeoutError, socket.timeout):
                  print(f"{model} timed out.")

              except Exception as e:
                  print(f"{model} failed: {type(e).__name__}: {e}")

          if not post or len(post) > 400:
              raise SystemExit(
                  "All Gemini fallback models failed."
              )

          with open("post.txt", "w", encoding="utf-8") as f:
              f.write(post)

          print("Final generated post:")
          print(post)
          PY
      - name: Download Binance Square skill
        run: |
          git clone --depth 1 \
            https://github.com/binance/binance-skills-hub.git

      - name: Publish to Binance Square
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          set -e

          if [ -z "$BINANCE_SQUARE_OPENAPI_KEY" ]; then
            echo "BINANCE_SQUARE_OPENAPI_KEY is missing."
            exit 1
          fi

          cd binance-skills-hub/skills/binance/square-post

          node scripts/post-text.mjs \
            --text "$(cat "$GITHUB_WORKSPACE/post.txt")"
