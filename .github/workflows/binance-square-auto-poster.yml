name: Binance Square Auto Publisher V2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose what to publish"
        required: true
        type: choice
        default: auto
        options:
          - auto
          - news
          - education
          - article

  schedule:
    # 09:05 Pakistan time
    - cron: "5 4 * * *"

    # 14:05 Pakistan time
    - cron: "5 9 * * *"

    # 20:05 Pakistan time
    - cron: "5 15 * * *"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
      REQUESTED_MODE: ${{ inputs.mode }}
      SCHEDULE_EXPRESSION: ${{ github.event.schedule }}

    steps:

      # ---------------------------------------------------------
      # 1. Decide which content mode to run
      # ---------------------------------------------------------
      - name: Select content mode
        run: |
          set -e

          MODE="$REQUESTED_MODE"

          if [ -z "$MODE" ] || [ "$MODE" = "auto" ]; then
            case "$SCHEDULE_EXPRESSION" in
              "5 4 * * *")
                MODE="news"
                ;;
              "5 9 * * *")
                MODE="education"
                ;;
              "5 15 * * *")
                MODE="article"
                ;;
              *)
                HOUR=$(TZ=Asia/Karachi date +%H)

                if [ "$HOUR" -lt 12 ]; then
                  MODE="news"
                elif [ "$HOUR" -lt 18 ]; then
                  MODE="education"
                else
                  MODE="article"
                fi
                ;;
            esac
          fi

          echo "Selected mode: $MODE"
          echo "$MODE" > mode.txt

      # ---------------------------------------------------------
      # 2. Install image-generation dependency
      # ---------------------------------------------------------
      - name: Install Pillow
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir Pillow

      # ---------------------------------------------------------
      # 3. Collect news + generate content
      # ---------------------------------------------------------
      - name: Generate AI content
        run: |
          set -e

          python3 - <<'PY'
          import datetime as dt
          import email.utils
          import html
          import json
          import os
          import re
          import socket
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET
          from collections import Counter

          GEMINI_API_KEY = os.environ["GEMINI_API_KEY"].strip()

          if not GEMINI_API_KEY:
              raise SystemExit("GEMINI_API_KEY is missing.")

          with open("mode.txt", "r", encoding="utf-8") as f:
              mode = f.read().strip()

          # Current Gemini fallback chain.
          MODELS = [
              "gemini-3.5-flash-lite",
              "gemini-3.7-flash",
              "gemini-3.6-flash",
          ]

          RSS_FEEDS = [
              (
                  "CoinDesk",
                  "https://www.coindesk.com/arc/outboundfeeds/rss/"
              ),
              (
                  "Cointelegraph",
                  "https://cointelegraph.com/rss"
              ),
              (
                  "Decrypt",
                  "https://decrypt.co/feed"
              ),
              (
                  "The Block",
                  "https://www.theblock.co/rss.xml"
              ),
              (
                  "Bitcoin Magazine",
                  "https://bitcoinmagazine.com/.rss/full/"
              ),
          ]

          CRYPTO_KEYWORDS = {
              "bitcoin",
              "btc",
              "ethereum",
              "eth",
              "binance",
              "bnb",
              "solana",
              "sol",
              "stablecoin",
              "defi",
              "etf",
              "regulation",
              "sec",
              "fed",
              "blockchain",
              "crypto",
              "digital asset",
              "token",
              "hack",
              "exploit",
              "security",
              "exchange",
              "wallet",
              "layer 2",
              "web3",
              "institutional",
              "mining",
              "staking",
          }

          STOPWORDS = {
              "the", "a", "an", "and", "or", "of", "to", "in", "on",
              "for", "with", "as", "by", "from", "at", "is", "are",
              "was", "were", "this", "that", "into", "after", "before",
              "over", "under", "new", "news"
          }

          def clean_text(value):
              if value is None:
                  return ""

              value = html.unescape(value)

              value = re.sub(
                  r"<script[^>]*>.*?</script>",
                  " ",
                  value,
                  flags=re.I | re.S,
              )

              value = re.sub(
                  r"<style[^>]*>.*?</style>",
                  " ",
                  value,
                  flags=re.I | re.S,
              )

              value = re.sub(r"<[^>]+>", " ", value)
              value = re.sub(r"\s+", " ", value)

              return value.strip()

          def local_name(tag):
              return tag.split("}", 1)[-1]

          def child_text(element, wanted):
              for child in element:
                  if local_name(child.tag).lower() == wanted.lower():
                      return clean_text(child.text or "")
              return ""

          def parse_date(value):
              if not value:
                  return dt.datetime.now(dt.timezone.utc)

              try:
                  parsed = email.utils.parsedate_to_datetime(value)

                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=dt.timezone.utc)

                  return parsed.astimezone(dt.timezone.utc)

              except Exception:
                  return dt.datetime.now(dt.timezone.utc)

          def fetch_feed(source, feed_url):
              request = urllib.request.Request(
                  feed_url,
                  headers={
                      "User-Agent":
                          "Mozilla/5.0 BinanceSquareAutoPublisher/2.0"
                  },
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=20
                  ) as response:
                      raw = response.read()

                  root = ET.fromstring(raw)

                  entries = []

                  # RSS
                  for element in root.iter():
                      if local_name(element.tag).lower() == "item":

                          title = child_text(element, "title")
                          link = child_text(element, "link")
                          description = (
                              child_text(element, "description")
                              or child_text(element, "summary")
                          )
                          published = (
                              child_text(element, "pubDate")
                              or child_text(element, "published")
                              or child_text(element, "updated")
                          )

                          if title and link:
                              entries.append({
                                  "source": source,
                                  "title": title,
                                  "url": link,
                                  "summary": description[:700],
                                  "published": parse_date(published),
                              })

                  # Atom fallback
                  if not entries:
                      for element in root.iter():
                          if local_name(element.tag).lower() == "entry":

                              title = child_text(element, "title")
                              summary = (
                                  child_text(element, "summary")
                                  or child_text(element, "content")
                              )
                              published = (
                                  child_text(element, "published")
                                  or child_text(element, "updated")
                              )

                              link = ""

                              for child in element:
                                  if local_name(child.tag).lower() == "link":
                                      href = child.attrib.get("href", "")
                                      if href:
                                          link = href
                                          break

                              if title and link:
                                  entries.append({
                                      "source": source,
                                      "title": title,
                                      "url": link,
                                      "summary": summary[:700],
                                      "published": parse_date(published),
                                  })

                  return entries

              except Exception as exc:
                  print(
                      f"Feed failed: {source}: "
                      f"{type(exc).__name__}: {exc}"
                  )
                  return []

          def normalize_tokens(text):
              text = re.sub(r"[^a-zA-Z0-9$]+", " ", text.lower())

              return {
                  token
                  for token in text.split()
                  if len(token) > 2 and token not in STOPWORDS
              }

          def relevance_score(item, now):
              age_hours = max(
                  0.0,
                  (now - item["published"]).total_seconds() / 3600
              )

              recency = max(0.0, 48.0 - age_hours)

              blob = (
                  item["title"] + " " + item["summary"]
              ).lower()

              keyword_score = 0

              for keyword in CRYPTO_KEYWORDS:
                  if keyword in blob:
                      keyword_score += 2

              source_bonus = {
                  "CoinDesk": 5,
                  "Cointelegraph": 4,
                  "Decrypt": 4,
                  "The Block": 5,
                  "Bitcoin Magazine": 3,
              }.get(item["source"], 1)

              return recency + keyword_score + source_bonus

          def get_news():
              now = dt.datetime.now(dt.timezone.utc)

              all_items = []

              for source, url in RSS_FEEDS:
                  items = fetch_feed(source, url)
                  all_items.extend(items)

              print(f"Collected {len(all_items)} feed items.")

              if not all_items:
                  return []

              # Keep recent items first.
              recent_cutoff = now - dt.timedelta(hours=48)

              recent = [
                  item
                  for item in all_items
                  if item["published"] >= recent_cutoff
              ]

              if not recent:
                  recent = all_items

              # Remove duplicate URLs.
              seen_urls = set()
              unique = []

              for item in recent:
                  if item["url"] in seen_urls:
                      continue

                  seen_urls.add(item["url"])
                  unique.append(item)

              # Score items.
              for item in unique:
                  item["score"] = relevance_score(item, now)

              unique.sort(
                  key=lambda x: x["score"],
                  reverse=True,
              )

              # Light cross-source clustering.
              clusters = []

              for item in unique:
                  item_tokens = normalize_tokens(item["title"])

                  best_cluster = None
                  best_overlap = 0.0

                  for cluster in clusters:
                      cluster_tokens = cluster["tokens"]

                      if not item_tokens or not cluster_tokens:
                          continue

                      intersection = len(
                          item_tokens & cluster_tokens
                      )

                      union = len(
                          item_tokens | cluster_tokens
                      )

                      overlap = intersection / max(union, 1)

                      if overlap > best_overlap:
                          best_overlap = overlap
                          best_cluster = cluster

                  if best_cluster is not None and best_overlap >= 0.45:
                      best_cluster["items"].append(item)
                      best_cluster["tokens"] |= item_tokens
                  else:
                      clusters.append({
                          "items": [item],
                          "tokens": set(item_tokens),
                      })

              # Rank clusters by source diversity + recency.
              ranked_clusters = []

              for cluster in clusters:
                  source_count = len(
                      {
                          item["source"]
                          for item in cluster["items"]
                      }
                  )

                  cluster_score = max(
                      item["score"]
                      for item in cluster["items"]
                  )

                  cluster_score += source_count * 15

                  ranked_clusters.append(
                      (
                          cluster_score,
                          source_count,
                          cluster,
                      )
                  )

              ranked_clusters.sort(
                  key=lambda x: (x[0], x[1]),
                  reverse=True,
              )

              final_items = []

              for _, _, cluster in ranked_clusters:
                  cluster_items = sorted(
                      cluster["items"],
                      key=lambda x: x["published"],
                      reverse=True,
                  )

                  for item in cluster_items[:2]:
                      final_items.append(item)

                  if len(final_items) >= 10:
                      break

              return final_items[:10]

          def save_file(path, value):
              with open(path, "w", encoding="utf-8") as f:
                  f.write(value.strip())

          def extract_json(text):
              text = text.strip()

              text = re.sub(
                  r"^```(?:json)?\s*",
                  "",
                  text,
                  flags=re.I,
              )

              text = re.sub(
                  r"\s*```$",
                  "",
                  text,
              )

              start = text.find("{")
              end = text.rfind("}")

              if start == -1 or end == -1:
                  raise ValueError(
                      "No JSON object found in Gemini response."
                  )

              return json.loads(text[start:end + 1])

          def call_gemini(prompt, max_output_tokens=1200):
              errors = []

              for model in MODELS:

                  print(f"Trying Gemini model: {model}")

                  url = (
                      "https://generativelanguage.googleapis.com/"
                      f"v1beta/models/{model}:generateContent"
                  )

                  body = {
                      "contents": [
                          {
                              "parts": [
                                  {
                                      "text": prompt
                                  }
                              ]
                          }
                      ],
                      "generationConfig": {
                          "temperature": 0.75,
                          "maxOutputTokens": max_output_tokens,
                      },
                  }

                  request = urllib.request.Request(
                      url,
                      data=json.dumps(body).encode("utf-8"),
                      headers={
                          "Content-Type": "application/json",
                          "x-goog-api-key": GEMINI_API_KEY,
                      },
                      method="POST",
                  )

                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=45
                      ) as response:

                          result = json.load(response)

                      candidates = result.get(
                          "candidates",
                          []
                      )

                      if not candidates:
                          raise ValueError(
                              "Gemini returned no candidates."
                          )

                      parts = candidates[0].get(
                          "content", {}
                      ).get("parts", [])

                      generated = "".join(
                          part.get("text", "")
                          for part in parts
                          if isinstance(part, dict)
                      ).strip()

                      if not generated:
                          raise ValueError(
                              "Gemini returned empty text."
                          )

                      print(
                          f"SUCCESS with {model}"
                      )

                      return generated, model

                  except urllib.error.HTTPError as exc:
                      detail = exc.read().decode(
                          "utf-8",
                          errors="replace",
                      )

                      message = (
                          f"{model}: HTTP {exc.code} "
                          f"{detail[:700]}"
                      )

                      print(message)
                      errors.append(message)

                  except (
                      TimeoutError,
                      socket.timeout,
                  ) as exc:

                      message = (
                          f"{model}: timeout: {exc}"
                      )

                      print(message)
                      errors.append(message)

                  except Exception as exc:

                      message = (
                          f"{model}: "
                          f"{type(exc).__name__}: {exc}"
                      )

                      print(message)
                      errors.append(message)

              raise SystemExit(
                  "All Gemini models failed:\n"
                  + "\n".join(errors)
              )

          def generate_news(news_items):

              if not news_items:
                  return None

              news_payload = []

              for index, item in enumerate(news_items, 1):
                  news_payload.append({
                      "id": index,
                      "source": item["source"],
                      "title": item["title"],
                      "published_utc": item[
                          "published"
                      ].isoformat(),
                      "summary": item["summary"],
                      "url": item["url"],
                  })

              payload_text = json.dumps(
                  news_payload,
                  ensure_ascii=False,
                  indent=2,
              )

              now_pkt = (
                  dt.datetime.now(
                      dt.timezone.utc
                  )
                  + dt.timedelta(hours=5)
              )

              prompt = f"""
          You are the editorial engine for a Binance Square crypto account.

          Current Pakistan date/time:
          {now_pkt.isoformat()}

          Below is fresh crypto news collected from public RSS feeds.

          NEWS DATA:
          {payload_text}

          Select ONE strongest story.

          Selection rules:
          - Prefer recent, important crypto/blockchain news.
          - Prefer stories covered by more than one source.
          - Never invent facts.
          - Never turn an unconfirmed report into a confirmed fact.
          - If a story is only reported by one source, use wording such
            as "reported by..." when appropriate.
          - Ignore promotional giveaways, obvious spam and low-value stories.
          - Do not create investment advice.
          - Do not make price predictions.

          Return ONLY valid JSON:

          {{
            "title": "short article title",
            "short_post": "maximum 380 characters, engaging but factual",
            "image_headline": "maximum 55 characters",
            "image_subtitle": "maximum 100 characters",
            "hashtags": ["#CryptoNews", "#Bitcoin", "#Blockchain"]
          }}

          The short post must:
          - be under 380 characters;
          - contain no guaranteed profit claims;
          - contain no buy/sell instruction;
          - contain no fake numbers;
          - use at most 3 hashtags.
          """

              for attempt in range(2):
                  try:
                      generated, model = call_gemini(
                          prompt,
                          max_output_tokens=700,
                      )

                      data = extract_json(generated)

                      post = str(
                          data.get("short_post", "")
                      ).strip()

                      if not post:
                          raise ValueError(
                              "Short post is empty."
                          )

                      if len(post) > 380:
                          post = post[:377] + "..."

                      data["short_post"] = post
                      data["_model"] = model

                      return data

                  except Exception as exc:
                      print(
                          "News JSON generation error:",
                          exc,
                      )

              return None

          def generate_education():

              topics = [
                  "risk management",
                  "Bitcoin wallets",
                  "stablecoins",
                  "blockchain basics",
                  "trading psychology",
                  "spot vs futures",
                  "self-custody",
                  "DeFi basics",
                  "crypto scams",
                  "on-chain data",
                  "liquidity",
                  "market cycles",
                  "dollar-cost averaging",
                  "private keys",
                  "network fees",
              ]

              today = dt.datetime.now(
                  dt.timezone.utc
              ).date()

              day_index = today.timetuple().tm_yday

              topic = topics[
                  day_index % len(topics)
              ]

              prompt = f"""
          Create one original educational Binance Square post.

          Topic:
          {topic}

          Requirements:
          - Maximum 380 characters.
          - Teach one useful concept clearly.
          - Professional and easy to understand.
          - No financial advice.
          - No promise of profits.
          - No buy/sell instruction.
          - No price prediction.
          - No fake statistics.
          - Maximum 3 hashtags.

          Return ONLY valid JSON:

          {{
            "short_post": "...",
            "image_headline": "...",
            "image_subtitle": "...",
            "hashtags": ["#CryptoEducation", "#Blockchain"]
          }}
          """

              generated, model = call_gemini(
                  prompt,
                  max_output_tokens=500,
              )

              data = extract_json(generated)

              post = str(
                  data.get("short_post", "")
              ).strip()

              if not post:
                  raise SystemExit(
                      "Education post is empty."
                  )

              data["short_post"] = post[:380]
              data["_model"] = model

              return data

          def generate_article(news_items):

              if not news_items:
                  news_items = []

              news_payload = []

              for item in news_items[:10]:
                  news_payload.append({
                      "source": item["source"],
                      "title": item["title"],
                      "published_utc": item[
                          "published"
                      ].isoformat(),
                      "summary": item["summary"],
                      "url": item["url"],
                  })

              payload_text = json.dumps(
                  news_payload,
                  ensure_ascii=False,
                  indent=2,
              )

              now_pkt = (
                  dt.datetime.now(
                      dt.timezone.utc
                  )
                  + dt.timedelta(hours=5)
              )

              prompt = f"""
          You are a crypto research writer creating a Binance Square article.

          Current Pakistan date/time:
          {now_pkt.isoformat()}

          Use the supplied recent news feed data as your source material.

          NEWS:
          {payload_text}

          Write ONE useful deep-dive article.

          Rules:
          - About 2500-4500 characters.
          - Focus on one meaningful crypto story or theme.
          - Explain what happened.
          - Explain why it matters.
          - Explain the broader context.
          - Clearly distinguish confirmed facts from reports or uncertainty.
          - No fabricated statistics.
          - No fabricated quotations.
          - No financial advice.
          - No guaranteed returns.
          - No price prediction.
          - Do not tell readers to buy or sell.
          - Do not copy source wording.
          - Write an original summary.

          Structure:
          1. Introduction
          2. What happened
          3. Why it matters
          4. What to watch next
          5. Conclusion

          Return ONLY valid JSON:

          {{
            "title": "article title",
            "article": "complete article body",
            "image_headline": "short cover headline",
            "image_subtitle": "short cover subtitle"
          }}
          """

              generated, model = call_gemini(
                  prompt,
                  max_output_tokens=2200,
              )

              data = extract_json(generated)

              title = str(
                  data.get("title", "")
              ).strip()

              article = str(
                  data.get("article", "")
              ).strip()

              if not title:
                  raise SystemExit(
                      "Article title is empty."
                  )

              if not article:
                  raise SystemExit(
                      "Article body is empty."
                  )

              # Conservative length limit.
              if len(article) > 5000:
                  article = article[:5000]

              data["title"] = title[:120]
              data["article"] = article
              data["_model"] = model

              return data

          # -----------------------------------------------------
          # Generate requested content
          # -----------------------------------------------------

          news_items = []

          if mode in ("news", "article"):
              news_items = get_news()

          selected_news = news_items[0] if news_items else None

          source_urls = []
          source_names = []

          if selected_news:
              source_urls.append(
                  selected_news["url"]
              )
              source_names.append(
                  selected_news["source"]
              )

          if news_items:
              # Add additional distinct sources.
              for item in news_items:
                  if item["source"] not in source_names:
                      source_names.append(
                          item["source"]
                      )

                  if (
                      item["url"] not in source_urls
                      and len(source_urls) < 4
                  ):
                      source_urls.append(
                          item["url"]
                      )

          if mode == "news":

              news_data = generate_news(
                  news_items
              )

              if news_data is None:
                  print(
                      "Fresh news generation failed; "
                      "using educational fallback."
                  )

                  mode = "education"
                  news_data = generate_education()

              data = news_data

              save_file(
                  "post.txt",
                  data["short_post"],
              )

              save_file(
                  "image_headline.txt",
                  data.get(
                      "image_headline",
                      "CRYPTO NEWS"
                  ),
              )

              save_file(
                  "image_subtitle.txt",
                  data.get(
                      "image_subtitle",
                      "Latest crypto update"
                  ),
              )

              if selected_news:
                  save_file(
                      "content_title.txt",
                      data.get(
                          "title",
                          selected_news["title"]
                      ),
                  )
              else:
                  save_file(
                      "content_title.txt",
                      "Crypto Update"
                  )

              save_file(
                  "source_names.txt",
                  ", ".join(source_names[:4]),
              )

          elif mode == "education":

              data = generate_education()

              save_file(
                  "post.txt",
                  data["short_post"],
              )

              save_file(
                  "image_headline.txt",
                  data.get(
                      "image_headline",
                      "CRYPTO EDUCATION"
                  ),
              )

              save_file(
                  "image_subtitle.txt",
                  data.get(
                      "image_subtitle",
                      "Learn one useful concept today"
                  ),
              )

              save_file(
                  "content_title.txt",
                  "Crypto Education",
              )

              save_file(
                  "source_names.txt",
                  "Educational content",
              )

          elif mode == "article":

              article_data = generate_article(
                  news_items
              )

              article = article_data["article"]

              # Add original source links collected
              # from the RSS feeds.
              if source_urls:
                  article += "\n\nSources:\n"

                  for index, url in enumerate(
                      source_urls[:4],
                      start=1,
                  ):
                      article += (
                          f"{index}. {url}\n"
                      )

              save_file(
                  "post.txt",
                  article[:5000],
              )

              save_file(
                  "article.txt",
                  article[:5000],
              )

              save_file(
                  "content_title.txt",
                  article_data["title"],
              )

              save_file(
                  "image_headline.txt",
                  article_data.get(
                      "image_headline",
                      article_data["title"]
                  ),
              )

              save_file(
                  "image_subtitle.txt",
                  article_data.get(
                      "image_subtitle",
                      "Crypto deep dive"
                  ),
              )

              save_file(
                  "source_names.txt",
                  ", ".join(source_names[:4])
                  if source_names
                  else "Crypto news sources",
              )

          else:
              raise SystemExit(
                  f"Unknown mode: {mode}"
              )

          # Write final mode after fallback decisions.
          save_file(
              "mode.txt",
              mode,
          )

          print("")
          print("================================")
          print("FINAL CONTENT MODE:", mode)
          print("================================")
          print("")

          print(
              open(
                  "post.txt",
                  encoding="utf-8"
              ).read()
          )

          print("")
          print(
              "Sources:",
              open(
                  "source_names.txt",
                  encoding="utf-8"
              ).read(),
          )

          PY

      # ---------------------------------------------------------
      # 4. Create an original visual card locally
      # ---------------------------------------------------------
      - name: Create automatic image
        run: |
          set -e

          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import datetime as dt
          import os
          import textwrap

          WIDTH = 1200
          HEIGHT = 675

          mode = open(
              "mode.txt",
              encoding="utf-8"
          ).read().strip()

          headline = open(
              "image_headline.txt",
              encoding="utf-8"
          ).read().strip()

          subtitle = open(
              "image_subtitle.txt",
              encoding="utf-8"
          ).read().strip()

          sources = open(
              "source_names.txt",
              encoding="utf-8"
          ).read().strip()

          if mode == "news":
              label = "TRENDING CRYPTO NEWS"
          elif mode == "article":
              label = "CRYPTO DEEP DIVE"
          else:
              label = "CRYPTO EDUCATION"

          image = Image.new(
              "RGB",
              (WIDTH, HEIGHT),
              (15, 20, 32)
          )

          draw = ImageDraw.Draw(image)

          # Decorative blocks
          draw.rectangle(
              (0, 0, WIDTH, 18),
              fill=(35, 150, 220)
          )

          draw.rectangle(
              (0, HEIGHT - 15, WIDTH, HEIGHT),
              fill=(35, 150, 220)
          )

          font_dir = (
              "/usr/share/fonts/truetype/"
              "dejavu"
          )

          def font(name, size):
              path = os.path.join(
                  font_dir,
                  name
              )

              try:
                  return ImageFont.truetype(
                      path,
                      size
                  )
              except Exception:
                  return ImageFont.load_default()

          label_font = font(
              "DejaVuSans-Bold.ttf",
              34
          )

          title_font = font(
              "DejaVuSans-Bold.ttf",
              64
          )

          subtitle_font = font(
              "DejaVuSans.ttf",
              34
          )

          small_font = font(
              "DejaVuSans.ttf",
              22
          )

          draw.text(
              (70, 60),
              label,
              font=label_font,
              fill=(240, 245, 250)
          )

          # Wrap headline.
          headline_lines = textwrap.wrap(
              headline,
              width=25
          )

          y = 150

          for line in headline_lines[:3]:
              draw.text(
                  (70, y),
                  line,
                  font=title_font,
                  fill=(255, 255, 255)
              )

              y += 78

          y += 10

          subtitle_lines = textwrap.wrap(
              subtitle,
              width=55
          )

          for line in subtitle_lines[:3]:
              draw.text(
                  (70, y),
                  line,
                  font=subtitle_font,
                  fill=(205, 215, 225)
              )

              y += 45

          today = (
              dt.datetime.now(
                  dt.timezone.utc
              )
              + dt.timedelta(hours=5)
          ).strftime("%d %b %Y")

          draw.text(
              (70, 575),
              f"{today}  •  Binance Square",
              font=small_font,
              fill=(170, 185, 200)
          )

          if sources:
              source_text = (
                  "Sources: "
                  + sources[:120]
              )

              draw.text(
                  (70, 615),
                  source_text,
                  font=small_font,
                  fill=(150, 165, 180)
              )

          # Save one common image.
          image.save(
              "square_visual.png",
              "PNG",
              optimize=True
          )

          # Article cover can use the same generated
          # visual, which keeps the system entirely
          # API-key free on the image side.
          image.save(
              "article_cover.png",
              "PNG",
              optimize=True
          )

          print("Image created successfully.")

          PY

      # ---------------------------------------------------------
      # 5. Download official Binance Square skill
      # ---------------------------------------------------------
      - name: Download official Binance Square skill
        run: |
          set -e

          git clone --depth 1 \
            https://github.com/binance/binance-skills-hub.git

          cd binance-skills-hub/skills/binance/square-post

          node --version

      # ---------------------------------------------------------
      # 6. Publish to Binance Square
      # ---------------------------------------------------------
      - name: Publish to Binance Square
        run: |
          set -e

          if [ -z "$BINANCE_SQUARE_OPENAPI_KEY" ]; then
            echo "BINANCE_SQUARE_OPENAPI_KEY is missing."
            exit 1
          fi

          MODE=$(cat mode.txt)

          cd "$GITHUB_WORKSPACE/binance-skills-hub/skills/binance/square-post"

          if [ "$MODE" = "news" ]; then

            echo "Publishing TRENDING NEWS image post..."

            node scripts/post-image.mjs \
              --text "$(cat "$GITHUB_WORKSPACE/post.txt")" \
              --images "$GITHUB_WORKSPACE/square_visual.png"

          elif [ "$MODE" = "education" ]; then

            echo "Publishing EDUCATIONAL image post..."

            node scripts/post-image.mjs \
              --text "$(cat "$GITHUB_WORKSPACE/post.txt")" \
              --images "$GITHUB_WORKSPACE/square_visual.png"

          elif [ "$MODE" = "article" ]; then

            echo "Publishing ARTICLE with cover image..."

            node scripts/post-image.mjs \
              --text "$(cat "$GITHUB_WORKSPACE/article.txt")" \
              --title "$(cat "$GITHUB_WORKSPACE/content_title.txt")" \
              --cover "$GITHUB_WORKSPACE/article_cover.png"

          else

            echo "Unknown mode: $MODE"
            exit 1

          fi
