name: Binance Square Auto Publisher V4.1

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Test content type"
        required: true
        type: choice
        default: news
        options:
          - news
          - education
          - article

  schedule:
    - cron: "5 4 * * *"
    - cron: "5 9 * * *"
    - cron: "5 15 * * *"

permissions:
  contents: read

concurrency:
  group: binance-square-v4
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      INPUT_MODE: ${{ inputs.mode }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}

    steps:
      - name: Select mode
        shell: bash
        run: |
          set -euo pipefail

          MODE="${INPUT_MODE:-}"

          if [ -z "$MODE" ]; then
            case "$EVENT_SCHEDULE" in
              "5 4 * * *") MODE="news" ;;
              "5 9 * * *") MODE="education" ;;
              "5 15 * * *") MODE="article" ;;
              *)
                H=$(TZ=Asia/Karachi date +%H)
                if [ "$H" -lt 12 ]; then MODE="news"
                elif [ "$H" -lt 18 ]; then MODE="education"
                else MODE="article"
                fi
                ;;
            esac
          fi

          echo "CONTENT_MODE=$MODE" >> "$GITHUB_ENV"
          echo "Mode: $MODE"

      - name: Install image and feed tools
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir Pillow

      - name: Generate editorial content and premium visual
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import datetime as dt
          import email.utils
          import html
          import io
          import json
          import os
          import re
          import socket
          import textwrap
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          from PIL import Image, ImageDraw, ImageFilter, ImageFont

          GEMINI_KEY = os.environ["GEMINI_API_KEY"].strip()
          MODE = os.environ["CONTENT_MODE"].strip()
          NOW = dt.datetime.now(dt.timezone.utc)
          NOW_PK = NOW + dt.timedelta(hours=5)

          if not GEMINI_KEY:
              raise SystemExit("GEMINI_API_KEY is missing.")

          # Current Gemini text-model fallback chain.
          MODELS = [
              "gemini-3.8-flash",
              "gemini-3.7-flash",
              "gemini-3.6-flash",
              "gemini-3.5-flash-lite",
              "gemini-3.1-flash-lite",
          ]

          FEEDS = [
              ("CoinDesk", "https://www.coindesk.com/arc/outboundfeeds/rss/"),
              ("Cointelegraph", "https://cointelegraph.com/rss"),
              ("Decrypt", "https://decrypt.co/feed"),
              ("The Block", "https://www.theblock.co/rss.xml"),
              ("Blockworks", "https://blockworks.co/feed"),
              ("Bitcoin Magazine", "https://bitcoinmagazine.com/.rss/full/"),
          ]

          COINS = {
              "bitcoin": "BTC",
              "btc": "BTC",
              "ethereum": "ETH",
              "eth": "ETH",
              "binance": "BNB",
              "bnb": "BNB",
              "solana": "SOL",
              "sol": "SOL",
              "xrp": "XRP",
              "ripple": "XRP",
              "cardano": "ADA",
              "ada": "ADA",
              "dogecoin": "DOGE",
              "doge": "DOGE",
              "chainlink": "LINK",
              "link": "LINK",
              "avalanche": "AVAX",
              "avax": "AVAX",
              "sui": "SUI",
              "toncoin": "TON",
              "ton": "TON",
              "tron": "TRX",
              "trx": "TRX",
              "polkadot": "DOT",
              "dot": "DOT",
              "litecoin": "LTC",
              "ltc": "LTC",
          }

          def clean(v):
              v = html.unescape(v or "")
              v = re.sub(r"<[^>]+>", " ", v)
              return re.sub(r"\s+", " ", v).strip()

          def lname(tag):
              return tag.split("}", 1)[-1].lower()

          def child_text(parent, wanted):
              for child in parent:
                  if lname(child.tag) == wanted.lower():
                      return clean(child.text or "")
              return ""

          def parse_date(v):
              if not v:
                  return NOW
              try:
                  x = email.utils.parsedate_to_datetime(v)
                  if x.tzinfo is None:
                      x = x.replace(tzinfo=dt.timezone.utc)
                  return x.astimezone(dt.timezone.utc)
              except Exception:
                  return NOW

          def feed_items(source, url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0 BinanceSquareV4.1/1.0"}
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      raw = r.read()

                  root = ET.fromstring(raw)
                  out = []

                  for item in root.iter():
                      if lname(item.tag) == "item":
                          title = child_text(item, "title")
                          link = child_text(item, "link")
                          summary = (
                              child_text(item, "description")
                              or child_text(item, "summary")
                          )
                          published = (
                              child_text(item, "pubdate")
                              or child_text(item, "published")
                              or child_text(item, "updated")
                          )
                          if title and link:
                              out.append({
                                  "source": source,
                                  "title": title,
                                  "summary": summary[:1000],
                                  "url": link,
                                  "published": parse_date(published),
                              })

                  if not out:
                      for entry in root.iter():
                          if lname(entry.tag) == "entry":
                              title = child_text(entry, "title")
                              summary = (
                                  child_text(entry, "summary")
                                  or child_text(entry, "content")
                              )
                              published = (
                                  child_text(entry, "published")
                                  or child_text(entry, "updated")
                              )
                              link = ""
                              for child in entry:
                                  if lname(child.tag) == "link":
                                      link = child.attrib.get("href", "")
                                      if link:
                                          break
                              if title and link:
                                  out.append({
                                      "source": source,
                                      "title": title,
                                      "summary": summary[:1000],
                                      "url": link,
                                      "published": parse_date(published),
                                  })

                  return out

              except Exception as exc:
                  print(f"Feed failed: {source}: {type(exc).__name__}: {exc}")
                  return []

          def collect_news():
              all_items = []
              for source, url in FEEDS:
                  all_items.extend(feed_items(source, url))

              cutoff = NOW - dt.timedelta(hours=72)
              items = [x for x in all_items if x["published"] >= cutoff]
              if not items:
                  items = all_items

              seen = set()
              unique = []
              for x in sorted(
                  items,
                  key=lambda z: z["published"],
                  reverse=True
              ):
                  key = re.sub(
                      r"\W+",
                      " ",
                      x["title"].lower()
                  ).strip()
                  if x["url"] in seen:
                      continue
                  seen.add(x["url"])
                  x["norm"] = key
                  unique.append(x)

              # Simple relevance score.
              words = [
                  "bitcoin", "ethereum", "binance", "bnb", "solana", "xrp",
                  "stablecoin", "defi", "etf", "sec", "regulation",
                  "blockchain", "crypto", "digital asset", "hack", "wallet",
                  "exchange", "institutional", "treasury", "federal reserve",
                  "fincen", "liquidity"
              ]

              for x in unique:
                  blob = (x["title"] + " " + x["summary"]).lower()
                  x["score"] = sum(
                      3 for w in words if w in blob
                  ) + max(
                      0,
                      72 - (
                          NOW - x["published"]
                      ).total_seconds() / 3600
                  )

              unique.sort(
                  key=lambda z: z["score"],
                  reverse=True
              )

              chosen = []
              for x in unique:
                  t1 = set(x["norm"].split())
                  duplicate = False
                  for y in chosen:
                      t2 = set(y["norm"].split())
                      if t1 and t2:
                          overlap = len(t1 & t2) / max(1, len(t1 | t2))
                          if overlap >= 0.72:
                              duplicate = True
                              break
                  if not duplicate:
                      chosen.append(x)
                  if len(chosen) >= 12:
                      break

              return chosen

          news = collect_news()
          print(f"Collected {len(news)} news candidates.")

          def gemini_request(model, prompt, max_tokens):
              url = (
                  "https://generativelanguage.googleapis.com/"
                  f"v1beta/models/{model}:generateContent"
              )

              body = {
                  "contents": [
                      {"parts": [{"text": prompt}]}
                  ],
                  "generationConfig": {
                      "temperature": 0.72,
                      "maxOutputTokens": max_tokens,
                  }
              }

              req = urllib.request.Request(
                  url,
                  data=json.dumps(body).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "x-goog-api-key": GEMINI_KEY,
                  },
                  method="POST"
              )

              with urllib.request.urlopen(req, timeout=50) as r:
                  data = json.load(r)

              parts = (
                  data.get("candidates", [{}])[0]
                  .get("content", {})
                  .get("parts", [])
              )

              text = "".join(
                  p.get("text", "")
                  for p in parts
                  if isinstance(p, dict)
              ).strip()

              if not text:
                  raise ValueError("Empty Gemini output.")

              return text

          def gemini(prompt, max_tokens):
              errors = []
              for model in MODELS:
                  print(f"Trying Gemini: {model}")
                  try:
                      text = gemini_request(
                          model,
                          prompt,
                          max_tokens
                      )
                      print(f"SUCCESS with {model}")
                      return text, model
                  except urllib.error.HTTPError as e:
                      detail = e.read().decode(
                          "utf-8",
                          errors="replace"
                      )
                      print(f"{model}: HTTP {e.code}: {detail[:600]}")
                      errors.append(
                          f"{model}: HTTP {e.code}"
                      )
                  except (TimeoutError, socket.timeout):
                      print(f"{model}: timeout")
                      errors.append(f"{model}: timeout")
                  except Exception as e:
                      print(
                          f"{model}: {type(e).__name__}: {e}"
                      )
                      errors.append(
                          f"{model}: {type(e).__name__}"
                      )

              raise SystemExit(
                  "All Gemini models failed: "
                  + ", ".join(errors)
              )

          def parse_json(text):
              text = re.sub(
                  r"^```(?:json)?\s*",
                  "",
                  text.strip(),
                  flags=re.I
              )
              text = re.sub(r"\s*```$", "", text)
              a = text.find("{")
              b = text.rfind("}")
              if a < 0 or b < 0:
                  raise ValueError("Gemini did not return JSON.")
              return json.loads(text[a:b+1])

          news_json = json.dumps(
              [
                  {
                      "source": x["source"],
                      "title": x["title"],
                      "published_utc": x["published"].isoformat(),
                      "summary": x["summary"],
                      "url": x["url"],
                  }
                  for x in news[:12]
              ],
              ensure_ascii=False
          )

          if MODE == "news":
              prompt = f"""
          You are the senior editorial and visual-content writer for a
          premium Binance Square crypto news account.

          Current Pakistan time:
          {NOW_PK.isoformat()}

          Fresh news candidates:
          {news_json}

          Select the strongest current story.

          Editorial rules:
          - 700-1000 characters for the main post.
          - Factual, substantial, and useful.
          - Use a hook, what happened, why it matters, and what to watch.
          - Do not invent facts, quotes, prices, dates, regulations or numbers.
          - Never turn a rumor into a confirmed fact.
          - No financial advice.
          - No guaranteed profit.
          - No buy/sell instruction.
          - No price prediction.
          - Do not call a story Bitcoin-specific unless the story actually
            concerns Bitcoin.
          - If the story is regulation, macro, policy, or ecosystem news,
            classify it as theme-based rather than forcing a coin pair.
          - For a true coin-specific story, identify the main coin.
          - Hashtags must be specific and useful.

          Return ONLY valid JSON:

          {{
            "headline": "strong 1-2 line headline",
            "subheadline": "one strong context sentence",
            "post": "700-1000 character post",
            "market_type": "coin or theme",
            "coin": "BTC or empty for theme",
            "pair": "BTC/USDT or empty for theme",
            "category": "Regulation / Bitcoin / DeFi / Security / etc",
            "sentiment": "positive / negative / neutral",
            "key_fact": "one short verified-looking factual takeaway",
            "hashtags": ["#Bitcoin", "#BTC", "#CryptoNews", "#Regulation"]
          }}
          """

              raw, model_used = gemini(
                  prompt,
                  1400
              )
              data = parse_json(raw)

          elif MODE == "education":
              prompt = f"""
          Create one premium educational Binance Square post.

          Current date:
          {NOW_PK.strftime("%d %B %Y")}

          The post should teach one useful crypto concept in 700-1000
          characters. It must include:
          - Hook
          - Clear explanation
          - Practical takeaway
          - One relevant coin example when appropriate
          - No financial advice
          - No guaranteed returns
          - No buy/sell instruction
          - No price prediction
          - 3-5 relevant hashtags

          Return ONLY valid JSON:

          {{
            "headline": "strong educational headline",
            "subheadline": "context",
            "post": "700-1000 character educational post",
            "market_type": "coin or theme",
            "coin": "BTC",
            "pair": "BTC/USDT",
            "category": "Crypto Education",
            "sentiment": "neutral",
            "key_fact": "one educational takeaway",
            "hashtags": ["#Bitcoin", "#CryptoEducation", "#Blockchain"]
          }}
          """

              raw, model_used = gemini(
                  prompt,
                  1400
              )
              data = parse_json(raw)

          elif MODE == "article":
              prompt = f"""
          Write one premium long-form Binance Square article based on the
          strongest current crypto story.

          Current Pakistan time:
          {NOW_PK.isoformat()}

          Candidate news:
          {news_json}

          Requirements:
          - 3000-5000 characters.
          - Original writing.
          - Strong headline.
          - Introduction.
          - What happened.
          - Why it matters.
          - Market/industry context.
          - What to watch next.
          - Conclusion.
          - Never invent facts, statistics, quotes or dates.
          - Distinguish reports, proposals and confirmed facts.
          - No financial advice.
          - No buy/sell instructions.
          - No guaranteed returns.
          - No price prediction.
          - Identify a relevant coin only if the story is coin-specific.
          - For regulation/macro themes, use market_type=theme.

          Return ONLY valid JSON:

          {{
            "headline": "article title",
            "article": "3000-5000 character article",
            "market_type": "coin or theme",
            "coin": "BTC or empty",
            "pair": "BTC/USDT or empty",
            "category": "Market Analysis",
            "sentiment": "positive / negative / neutral",
            "key_fact": "key takeaway",
            "hashtags": ["#CryptoNews", "#Bitcoin", "#Blockchain"]
          }}
          """

              raw, model_used = gemini(
                  prompt,
                  3500
              )
              data = parse_json(raw)

          else:
              raise SystemExit("Unsupported content mode.")

          def infer_coin(text):
              low = text.lower()

              for sym in re.findall(
                  r"\$([A-Z]{2,10})\b",
                  text.upper()
              ):
                  return sym

              for name, symbol in COINS.items():
                  if re.search(
                      r"\b" + re.escape(name) + r"\b",
                      low
                  ):
                      return symbol

              return ""

          market_type = str(
              data.get(
                  "market_type",
                  "theme"
              )
          ).lower().strip()

          coin = str(
              data.get("coin", "")
          ).upper().strip()

          if market_type == "coin":
              if not re.fullmatch(
                  r"[A-Z0-9]{2,12}",
                  coin
              ):
                  coin = infer_coin(
                      str(data.get("headline", "")) +
                      " " +
                      str(data.get("post", data.get("article", "")))
                  )

              if not coin:
                  coin = "BTC"

              pair = coin + "/USDT"
          else:
              coin = ""
              pair = ""

          tags = []
          for tag in data.get("hashtags", []):
              tag = str(tag).strip()
              tag = re.sub(
                  r"[^A-Za-z0-9_#]",
                  "",
                  tag
              )

              if tag and not tag.startswith("#"):
                  tag = "#" + tag

              if tag and tag.lower() not in {
                  x.lower() for x in tags
              }:
                  tags.append(tag)

          if market_type == "coin" and coin:
              must = ["#" + coin]
          else:
              must = []

          if MODE == "news":
              must.append("#CryptoNews")
          elif MODE == "education":
              must.append("#CryptoEducation")
          else:
              must.append("#CryptoAnalysis")

          # Binance Square hashtag safety: keep the final payload at 5 max.
          final_tags = []
          for tag in must + tags:
              if tag and tag.lower() not in {
                  x.lower() for x in final_tags
              }:
                  final_tags.append(tag)
              if len(final_tags) >= 5:
                  break

          tags = final_tags

          if MODE == "article":
              body = clean(
                  str(data.get("article", ""))
              )

              if len(body) < 1800:
                  raise SystemExit(
                      "Article body is too short."
                  )

              if pair:
                  footer = (
                      f"\n\n📊 Pair: ${pair}"
                      f"\n{' '.join(tags)}"
                  )
              else:
                  footer = (
                      f"\n\n🎯 Market Focus: "
                      f"{data.get('category', 'Crypto')}"
                      f"\n{' '.join(tags)}"
                  )

              content = body[:5200] + footer
              title = clean(
                  str(data.get(
                      "headline",
                      "Crypto Deep Dive"
                  ))
              )[:130]

          else:
              body = clean(
                  str(data.get("post", ""))
              )

              if len(body) < 500:
                  raise SystemExit(
                      "Generated post is too short."
                  )

              if pair:
                  footer = (
                      f"\n\n📊 Pair: ${pair}"
                      f"\n{' '.join(tags)}"
                  )
              else:
                  footer = (
                      f"\n\n🎯 Market Focus: "
                      f"{data.get('category', 'Crypto')}"
                      f"\n{' '.join(tags)}"
                  )

              content = (
                  body[:1050] +
                  footer
              )

              title = ""

          # -------------------------------------------------------
          # Reliable market data with multiple public fallbacks.
          # -------------------------------------------------------

          def market_data(symbol):
              if not symbol:
                  return {
                      "available": False,
                      "pair": "",
                      "price": None,
                      "change": None,
                      "high": None,
                      "low": None,
                      "provider": "none",
                  }

              symbol = symbol.upper().strip()

              # 1) CoinGecko: broad asset coverage; no API key for this call.
              cg_ids = {
                  "BTC": "bitcoin",
                  "ETH": "ethereum",
                  "BNB": "binancecoin",
                  "SOL": "solana",
                  "XRP": "ripple",
                  "ADA": "cardano",
                  "DOGE": "dogecoin",
                  "LINK": "chainlink",
                  "AVAX": "avalanche-2",
                  "SUI": "sui",
                  "TON": "the-open-network",
                  "TRX": "tron",
                  "DOT": "polkadot",
                  "LTC": "litecoin",
                  "SHIB": "shiba-inu",
                  "PEPE": "pepe",
                  "ATOM": "cosmos",
                  "UNI": "uniswap",
                  "AAVE": "aave",
              }

              coin_id = cg_ids.get(symbol)
              if coin_id:
                  try:
                      url = (
                          "https://api.coingecko.com/api/v3/simple/price?"
                          + urllib.parse.urlencode({
                              "ids": coin_id,
                              "vs_currencies": "usd",
                              "include_24hr_change": "true",
                              "include_24hr_high": "true",
                              "include_24hr_low": "true",
                          })
                      )

                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "Mozilla/5.0 BinanceSquareV4.1"
                          },
                      )

                      with urllib.request.urlopen(req, timeout=15) as r:
                          row = json.load(r).get(coin_id, {})

                      price = row.get("usd")
                      change = row.get("usd_24h_change")
                      high = row.get("usd_24h_high")
                      low = row.get("usd_24h_low")

                      if price is not None:
                          return {
                              "available": True,
                              "pair": f"${symbol}/USDT",
                              "price": float(price),
                              "change": float(change) if change is not None else None,
                              "high": float(high) if high is not None else None,
                              "low": float(low) if low is not None else None,
                              "provider": "CoinGecko",
                          }

                  except Exception as exc:
                      print(
                          "CoinGecko failed:",
                          type(exc).__name__,
                          exc,
                      )

              # 2) Coinbase fallback for common USD pairs.
              try:
                  url = (
                      "https://api.coinbase.com/v2/prices/"
                      f"{urllib.parse.quote(symbol)}-USD/spot"
                  )

                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0 BinanceSquareV4.1"
                      },
                  )

                  with urllib.request.urlopen(req, timeout=12) as r:
                      data = json.load(r)

                  price = float(data["data"]["amount"])

                  return {
                      "available": True,
                      "pair": f"${symbol}/USDT",
                      "price": price,
                      "change": None,
                      "high": None,
                      "low": None,
                      "provider": "Coinbase",
                  }

              except Exception as exc:
                  print(
                      "Coinbase failed:",
                      type(exc).__name__,
                      exc,
                  )

              return {
                  "available": False,
                  "pair": f"${symbol}/USDT",
                  "price": None,
                  "change": None,
                  "high": None,
                  "low": None,
                  "provider": "none",
              }

          market = market_data(coin)
          print("Market:", market)

          # -------------------------------------------------------
          # Find a free-license background photograph from Wikimedia.
          # This is used only as a visual background; all facts are
          # generated from the editorial data above.
          # -------------------------------------------------------

          def commons_photo(query):
              try:
                  params = {
                      "action": "query",
                      "generator": "search",
                      "gsrsearch": query,
                      "gsrnamespace": "6",
                      "gsrlimit": "10",
                      "prop": "imageinfo",
                      "iiprop": "url|mime|extmetadata",
                      "format": "json",
                      "origin": "*"
                  }

                  url = (
                      "https://commons.wikimedia.org/w/api.php?"
                      + urllib.parse.urlencode(params)
                  )

                  with urllib.request.urlopen(
                      urllib.request.Request(
                          url,
                          headers={
                              "User-Agent":
                                  "Mozilla/5.0 BinanceSquareV4"
                          }
                      ),
                      timeout=18
                  ) as r:
                      data = json.load(r)

                  pages = (
                      data.get("query", {})
                      .get("pages", {})
                  )

                  for page in pages.values():
                      info = page.get(
                          "imageinfo",
                          [{}]
                      )[0]

                      mime = info.get(
                          "mime",
                          ""
                      )

                      meta = info.get(
                          "extmetadata",
                          {}
                      )

                      license_name = clean(
                          meta.get(
                              "LicenseShortName",
                              {}
                          ).get("value", "")
                      ).lower()

                      if mime not in {
                          "image/jpeg",
                          "image/png",
                          "image/webp"
                      }:
                          continue

                      allowed = (
                          "cc by" in license_name
                          or
                          "public domain" in license_name
                      )

                      if not allowed:
                          continue

                      return {
                          "url": info.get("url"),
                          "name": clean(
                              page.get(
                                  "title",
                                  ""
                              )
                          ).replace(
                              "File:",
                              ""
                          ),
                          "license": license_name or "free-license"
                      }

              except Exception as e:
                  print(
                      "Commons search failed:",
                      type(e).__name__,
                      e
                  )

              return None

          background = None

          search_terms = []

          if data.get("category"):
              search_terms.append(
                  str(data["category"])
              )

          if coin:
              search_terms.append(
                  f"{coin} cryptocurrency"
              )

          search_terms.append(
              str(
                  data.get(
                      "headline",
                      "cryptocurrency"
                  )
              )[:120]
          )

          for q in search_terms:
              background = commons_photo(q)
              if background:
                  break

          if background:
              try:
                  req = urllib.request.Request(
                      background["url"],
                      headers={
                          "User-Agent":
                              "Mozilla/5.0 BinanceSquareV4"
                      }
                  )

                  with urllib.request.urlopen(
                      req,
                      timeout=25
                  ) as r:
                      raw_img = r.read()

                  bg_img = Image.open(
                      io.BytesIO(raw_img)
                  ).convert("RGB")

                  print(
                      "Using Commons photo:",
                      background["name"],
                      background["license"]
                  )

              except Exception as e:
                  print(
                      "Background download failed:",
                      type(e).__name__,
                      e
                  )
                  bg_img = None
          else:
              bg_img = None

          # -------------------------------------------------------
          # PREMIUM 1920x1080 composition
          # -------------------------------------------------------

          W, H = 1920, 1080

          navy = (7, 13, 28)
          gold = (246, 188, 35)
          cyan = (35, 184, 255)
          purple = (134, 91, 255)
          green = (35, 224, 140)
          red = (255, 76, 76)
          white = (248, 250, 253)
          muted = (187, 198, 216)

          sentiment = str(
              data.get(
                  "sentiment",
                  "neutral"
              )
          ).lower()

          if sentiment == "positive":
              accent = green
          elif sentiment == "negative":
              accent = red
          else:
              accent = gold

          if bg_img:
              ratio = max(
                  W / bg_img.width,
                  H / bg_img.height
              )

              nw = int(
                  bg_img.width * ratio
              )
              nh = int(
                  bg_img.height * ratio
              )

              bg_img = bg_img.resize(
                  (nw, nh),
                  Image.LANCZOS
              )

              left = (
                  nw - W
              ) // 2

              top = (
                  nh - H
              ) // 2

              canvas = bg_img.crop(
                  (left, top, left + W, top + H)
              )
          else:
              # Premium fallback: deep-gradient scene.
              canvas = Image.new(
                  "RGB",
                  (W, H),
                  navy
              )

              px = canvas.load()

              for y in range(H):
                  for x in range(W):
                      glow = int(
                          35 *
                          max(
                              0,
                              1 -
                              (
                                  (
                                      (x - 1450) ** 2 +
                                      (y - 300) ** 2
                                  )
                                  ** 0.5
                              ) / 1700
                          )
                      )

                      px[x, y] = (
                          min(255, 7 + glow // 3),
                          min(255, 13 + glow // 2),
                          min(255, 28 + glow)
                      )

          # Dark glass overlays.
          overlay = Image.new(
              "RGBA",
              (W, H),
              (5, 10, 22, 0)
          )

          od = ImageDraw.Draw(
              overlay
          )

          od.rectangle(
              (0, 0, W, H),
              fill=(2, 7, 18, 130)
          )

          od.rectangle(
              (0, 0, 1120, H),
              fill=(2, 7, 18, 205)
          )

          od.rectangle(
              (0, 760, W, H),
              fill=(2, 7, 18, 185)
          )

          canvas = Image.alpha_composite(
              canvas.convert("RGBA"),
              overlay
          ).convert("RGB")

          draw = ImageDraw.Draw(canvas)

          font_dir = (
              "/usr/share/fonts/truetype/dejavu"
          )

          def font(name, size):
              path = os.path.join(
                  font_dir,
                  name
              )
              try:
                  return ImageFont.truetype(
                      path,
                      size
                  )
              except Exception:
                  return ImageFont.load_default()

          F_HUGE = font(
              "DejaVuSansCondensed-Bold.ttf",
              84
          )

          F_TITLE = font(
              "DejaVuSansCondensed-Bold.ttf",
              70
          )

          F_SUB = font(
              "DejaVuSans.ttf",
              34
          )

          F_CARD = font(
              "DejaVuSansCondensed-Bold.ttf",
              37
          )

          F_BODY = font(
              "DejaVuSans.ttf",
              27
          )

          F_SMALL = font(
              "DejaVuSans.ttf",
              22
          )

          F_TAG = font(
              "DejaVuSansCondensed-Bold.ttf",
              24
          )

          # Top brand bar.
          draw.rounded_rectangle(
              (65, 50, 1855, 142),
              radius=24,
              fill=(7, 13, 28),
              outline=(69, 85, 112),
              width=2
          )

          draw.ellipse(
              (92, 70, 128, 106),
              fill=gold
          )

          draw.text(
              (145, 65),
              "BINANCE SQUARE",
              font=F_CARD,
              fill=gold
          )

          draw.text(
              (1450, 74),
              "CRYPTO NEWS" if MODE == "news"
              else "CRYPTO EDUCATION" if MODE == "education"
              else "CRYPTO DEEP DIVE",
              font=F_SUB,
              fill=white
          )

          draw.rounded_rectangle(
              (1745, 68, 1825, 122),
              radius=18,
              fill=accent
          )

          draw.text(
              (1763, 79),
              "HOT",
              font=font(
                  "DejaVuSansCondensed-Bold.ttf",
                  20
              ),
              fill=(10, 14, 22)
          )

          # News category label.
          label = (
              "TRENDING CRYPTO NEWS"
              if MODE == "news"
              else "SMART CRYPTO EDUCATION"
              if MODE == "education"
              else "PREMIUM CRYPTO ANALYSIS"
          )

          draw.rounded_rectangle(
              (78, 175, 760, 245),
              radius=20,
              fill=gold
          )

          draw.text(
              (110, 190),
              label,
              font=F_CARD,
              fill=(8, 12, 20)
          )

          headline = clean(
              str(
                  data.get(
                      "headline",
                      "Crypto Market Update"
                  )
              )
          )

          headline_lines = textwrap.wrap(
              headline,
              width=28
          )[:4]

          y = 285

          for i, line in enumerate(
              headline_lines
          ):
              # Highlight a few key words with accent.
              draw.text(
                  (82, y),
                  line,
                  font=F_TITLE,
                  fill=white
              )
              y += 78

          subheadline = clean(
              str(
                  data.get(
                      "subheadline",
                      ""
                  )
              )
          )

          sub_lines = textwrap.wrap(
              subheadline,
              width=58
          )[:3]

          y += 14

          for line in sub_lines:
              draw.text(
                  (88, y),
                  line,
                  font=F_SUB,
                  fill=muted
              )
              y += 42

          # Right-side subject panel.
          right_box = (
              1190,
              175,
              1815,
              705
          )

          draw.rounded_rectangle(
              right_box,
              radius=35,
              fill=(4, 10, 23),
              outline=(66, 82, 108),
              width=3
          )

          # Decorative coin / token.
          cx, cy = 1500, 330
          outer_r = 205

          for r in range(
              outer_r,
              125,
              -2
          ):
              t = (
                  outer_r - r
              ) / (
                  outer_r - 125
              )

              rr = int(
                  18 +
                  28 * t
              )

              gg = int(
                  24 +
                  30 * t
              )

              bb = int(
                  38 +
                  35 * t
              )

              draw.ellipse(
                  (
                      cx - r,
                      cy - r,
                      cx + r,
                      cy + r
                  ),
                  fill=(rr, gg, bb)
              )

          draw.ellipse(
              (
                  cx - 126,
                  cy - 126,
                  cx + 126,
                  cy + 126
              ),
              outline=accent,
              width=10
          )

          coin_label = (
              f"${coin}"
              if coin
              else "CRYPTO"
          )

          bbox = draw.textbbox(
              (0, 0),
              coin_label,
              font=F_HUGE
          )

          draw.text(
              (
                  cx - (
                      bbox[2] -
                      bbox[0]
                  ) / 2,
                  cy - 55
              ),
              coin_label,
              font=F_HUGE,
              fill=white
          )

          # Glow behind coin.
          glow = Image.new(
              "RGBA",
              (W, H),
              (0, 0, 0, 0)
          )

          gd = ImageDraw.Draw(
              glow
          )

          gd.ellipse(
              (
                  cx - 210,
                  cy - 210,
                  cx + 210,
                  cy + 210
              ),
              fill=(*accent, 55)
          )

          glow = glow.filter(
              ImageFilter.GaussianBlur(
                  42
              )
          )

          canvas = Image.alpha_composite(
              canvas.convert("RGBA"),
              glow
          ).convert("RGB")

          draw = ImageDraw.Draw(
              canvas
          )

          # Re-draw coin after glow.
          draw.ellipse(
              (
                  cx - 126,
                  cy - 126,
                  cx + 126,
                  cy + 126
              ),
              outline=accent,
              width=10
          )

          draw.text(
              (
                  cx - (
                      draw.textbbox(
                          (0, 0),
                          coin_label,
                          font=F_HUGE
                      )[2]
                  ) / 2,
                  cy - 55
              ),
              coin_label,
              font=F_HUGE,
              fill=white
          )

          if pair:
              draw.text(
                  (1330, 505),
                  f"PAIR   ${pair}",
                  font=F_CARD,
                  fill=accent
              )
          else:
              draw.text(
                  (1285, 505),
                  "MARKET FOCUS",
                  font=F_CARD,
                  fill=accent
              )

          draw.text(
              (1285, 555),
              clean(
                  str(
                      data.get(
                          "category",
                          "Crypto"
                      )
                  )
              )[:34],
              font=F_SUB,
              fill=white
          )

          # Market chart on bottom-right.
          chart_x1, chart_y1 = 1260, 615
          chart_x2, chart_y2 = 1760, 690

          draw.line(
              (chart_x1, chart_y2,
               chart_x2, chart_y2),
              fill=(80, 92, 112),
              width=2
          )

          if market["available"]:
              # A visual trend line based only on the live
              # price and 24h direction. It is explicitly
              # decorative; no fabricated values are shown.
              ch = market["change"]
              direction = 1 if (
                  ch is None or ch >= 0
              ) else -1

              pts = []
              for i in range(25):
                  xx = (
                      chart_x1 +
                      int(
                          (
                              chart_x2 -
                              chart_x1
                          ) * i / 24
                      )
                  )

                  wave = (
                      22 *
                      __import__("math").sin(
                          i * 0.62
                      )
                  )

                  trend = (
                      direction *
                      1.7 *
                      i
                  )

                  yy = int(
                      650 -
                      wave -
                      trend
                  )

                  pts.append(
                      (xx, yy)
                  )

              draw.line(
                  pts,
                  fill=(
                      green
                      if direction > 0
                      else red
                  ),
                  width=8
              )

              draw.text(
                  (1260, 705),
                  (
                      f"${market['price']:,.2f}"
                      if market["price"] is not None
                      else "Price unavailable"
                  ),
                  font=F_CARD,
                  fill=white
              )

              if ch is not None:
                  draw.text(
                      (1560, 710),
                      f"{ch:+.2f}% 24H",
                      font=F_CARD,
                      fill=(
                          green if ch >= 0
                          else red
                      )
                  )
          else:
              draw.text(
                  (1260, 640),
                  "LIVE MARKET DATA UNAVAILABLE",
                  font=F_SMALL,
                  fill=muted
              )

          # Information cards.
          card_y = 785
          card_h = 165

          if pair:
              cards = [
                  (
                      80,
                      540,
                      "PAIR",
                      f"${pair}",
                      gold
                  ),
                  (
                      565,
                      1025,
                      "MARKET",
                      clean(
                          str(
                              data.get(
                                  "category",
                                  "Crypto"
                              )
                          )
                      )[:25],
                      cyan
                  ),
                  (
                      1050,
                      1510,
                      "KEY FACT",
                      clean(
                          str(
                              data.get(
                                  "key_fact",
                                  "Monitor verified developments."
                              )
                          )
                      )[:80],
                      purple
                  ),
                  (
                      1535,
                      1835,
                      "24H",
                      (
                          f"{market['change']:+.2f}%"
                          if market["change"] is not None
                          else "N/A"
                      ),
                      (
                          green
                          if (
                              market["change"] is not None
                              and market["change"] >= 0
                          )
                          else red
                          if market["change"] is not None
                          else muted
                      )
                  ),
              ]
          else:
              cards = [
                  (
                      80,
                      515,
                      "MARKET FOCUS",
                      clean(
                          str(
                              data.get(
                                  "category",
                                  "Crypto"
                              )
                          )
                      )[:25],
                      gold
                  ),
                  (
                      540,
                      1010,
                      "WHY IT MATTERS",
                      clean(
                          str(
                              data.get(
                                  "key_fact",
                                  "Watch verified developments."
                              )
                          )[:80],
                      ),
                      cyan
                  ),
                  (
                      1035,
                      1505,
                      "SENTIMENT",
                      sentiment.upper(),
                      accent
                  ),
                  (
                      1530,
                      1835,
                      "DATE",
                      NOW_PK.strftime(
                          "%d %b %Y"
                      ),
                      purple
                  ),
              ]

          for x1, x2, label, value, col in cards:
              draw.rounded_rectangle(
                  (x1, card_y, x2, card_y + card_h),
                  radius=20,
                  fill=(8, 16, 31),
                  outline=col,
                  width=3
              )

              draw.text(
                  (x1 + 22, card_y + 20),
                  label,
                  font=F_SMALL,
                  fill=muted
              )

              wrapped = textwrap.wrap(
                  str(value),
                  width=max(
                      11,
                      int((x2 - x1) / 27)
                  )
              )[:3]

              yy = card_y + 62

              for line in wrapped:
                  draw.text(
                      (x1 + 22, yy),
                      line,
                      font=F_CARD
                      if len(wrapped) == 1
                      else F_BODY,
                      fill=white
                  )
                  yy += 37

          # Tags strip.
          draw.text(
              (80, 970),
              "TAGS",
              font=F_SMALL,
              fill=gold
          )

          tag_x = 165
          for tag in tags[:5]:
              width = draw.textbbox(
                  (0, 0),
                  tag,
                  font=F_TAG
              )[2] + 38

              draw.rounded_rectangle(
                  (
                      tag_x,
                      955,
                      tag_x + width,
                      1008
                  ),
                  radius=16,
                  fill=(7, 22, 43),
                  outline=cyan,
                  width=2
              )

              draw.text(
                  (tag_x + 18, 968),
                  tag,
                  font=F_TAG,
                  fill=white
              )

              tag_x += width + 12

          # Source / attribution.
          source_names = []
          for item in news[:4]:
              if item["source"] not in source_names:
                  source_names.append(
                      item["source"]
                  )

          if source_names:
              source_text = (
                  "Sources: " +
                  " • ".join(source_names)
              )
          else:
              source_text = "Sources: Editorial / educational"

          draw.text(
              (80, 1023),
              source_text[:145],
              font=F_SMALL,
              fill=muted
          )

          if background:
              draw.text(
                  (1170, 1023),
                  (
                      "Visual: Wikimedia Commons • "
                      + background["license"][:35]
                  ),
                  font=F_SMALL,
                  fill=(151, 164, 183)
              )

          # Save.
          canvas.save(
              "square_visual.png",
              "PNG",
              optimize=True
          )

          canvas.save(
              "article_cover.png",
              "PNG",
              optimize=True
          )

          with open(
              "content.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(content)

          with open(
              "title.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(title)

          with open(
              "mode.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(MODE)

          with open(
              "model.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(model_used)

          with open(
              "pair.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  f"${pair}" if pair else ""
              )

          print("")
          print("============================================")
          print("BINANCE SQUARE V4.1 READY")
          print("============================================")
          print("Mode:", MODE)
          print("Gemini:", model_used)
          print("Coin:", coin or "theme")
          print("Pair:", f"${pair}" if pair else "theme")
          print("Content chars:", len(content))
          print("Visual:", "1920x1080")
          print("Background:", background["name"] if background else "generated")
          print("")
          print(content)
          print("============================================")

          PY

      - name: Download official Binance Square skill
        run: |
          set -euo pipefail
          git clone --depth 1 \
            https://github.com/binance/binance-skills-hub.git
          node --version

      - name: Publish to Binance Square
        shell: bash
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$BINANCE_SQUARE_OPENAPI_KEY" ]; then
            echo "BINANCE_SQUARE_OPENAPI_KEY is missing."
            exit 1
          fi

          SKILL="$GITHUB_WORKSPACE/binance-skills-hub/skills/binance/square-post"

          cd "$SKILL"

          if [ "$CONTENT_MODE" = "article" ]; then
            node scripts/post-image.mjs \
              --text "$(cat "$GITHUB_WORKSPACE/content.txt")" \
              --title "$(cat "$GITHUB_WORKSPACE/title.txt")" \
              --cover "$GITHUB_WORKSPACE/article_cover.png"
          else
            node scripts/post-image.mjs \
              --text "$(cat "$GITHUB_WORKSPACE/content.txt")" \
              --images "$GITHUB_WORKSPACE/square_visual.png"
          fi

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Binance Square Publisher V4"
            echo ""
            echo "- Mode: \`$CONTENT_MODE\`"
            if [ -f model.txt ]; then
              echo "- Gemini: \`$(cat model.txt)\`"
            fi
            if [ -f pair.txt ] && [ -n "$(cat pair.txt)" ]; then
              echo "- Pair: \`$(cat pair.txt)\`"
            fi
            if [ -f content.txt ]; then
              echo "- Content: $(wc -m < content.txt) characters"
            fi
            echo "- Visual: 1920×1080"
            echo "- Image style: photo/visual background + glass panels + charts + accent colors"
          } >> "$GITHUB_STEP_SUMMARY"
